<title>乡野村 · 俯视角小样</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Same option-C "country boards" UI as the card page, laid over a top-down village that can be drawn as pixel art (A) or hand-painted (B). */
:root{--cream:#fff7e6;--rim:#5e4027;--ink:#4a3523;--ink-soft:#7a5d40;--leaf:#8fbf6a;--leaf-dk:#5e7d44;--night:#1d1a14;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:var(--f-sans);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(60,40,20,.28));transition:opacity .4s}
.board{background:var(--cream);border:3px solid var(--rim);box-shadow:0 5px 0 rgba(60,38,20,.3)}
.wood{background-color:#9a6b43;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,transparent 2px,transparent 9px),linear-gradient(180deg,#a8774c,#86592f);border:3px solid var(--rim);color:#fff4dd}
button{font-family:var(--f-sans);cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
#place{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:0;z-index:5;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
#place.swing{animation:swing 1.3s ease-out}
@keyframes swing{0%{transform:rotate(6deg)}35%{transform:rotate(-4deg)}65%{transform:rotate(2deg)}100%{transform:none}}
.ropes{display:flex;justify-content:space-around;width:70%}.ropes i{display:block;width:3px;height:18px;background:var(--rim)}
.sign{padding:5px 20px 9px;border-radius:10px;box-shadow:0 6px 0 rgba(60,38,20,.35);text-align:center;min-width:110px}
.sign small{display:block;font-size:12px;letter-spacing:4px;opacity:.85}
.sign b{display:block;font-family:var(--f-serif);font-weight:600;font-size:26px;letter-spacing:4px;text-shadow:0 2px 0 var(--rim);white-space:nowrap}
#modes{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:6;display:flex;padding:5px;gap:5px;border-radius:30px}
#modes button{height:42px;padding:0 18px;border-radius:21px;border:none;background:transparent;color:var(--ink-soft);font-size:15px;font-weight:700;white-space:nowrap}
#modes button[aria-pressed="true"]{background:var(--leaf);color:#2f3a1f;box-shadow:inset 0 0 0 2px var(--rim)}
#help{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:5;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.7;max-width:240px;color:var(--ink-soft)}
#help b{color:var(--ink)}
#tip{position:fixed;z-index:6;padding:6px 14px 6px 6px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;transform:translate(-50%,-100%);cursor:pointer;white-space:nowrap}
#tip::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--rim);border-bottom:0}
#tip kbd{width:24px;height:24px;border-radius:8px;background:var(--rim);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--f-sans)}
#act{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6;width:72px;height:72px;border-radius:50%;font-size:17px;font-weight:700;box-shadow:0 5px 0 rgba(60,38,20,.35)}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(880px,calc(100% - 32px));min-height:160px;display:none;z-index:7}
#dlg .box{position:absolute;inset:18px 0 0 0;border-radius:26px}
#dlg .tag{position:absolute;left:150px;top:0;padding:5px 20px 6px;border-radius:12px;font-family:var(--f-serif);font-size:20px;letter-spacing:4px}
#dlg .face{position:absolute;left:18px;bottom:16px;width:112px;height:112px;border-radius:50%;border:4px solid var(--rim);box-shadow:0 0 0 4px var(--cream);background:var(--cream) center/cover no-repeat}
#dlg .txt{position:relative;margin:52px 30px 24px 160px;font-size:19px;line-height:1.7;font-weight:500;min-height:60px}
#dlg.mono .tag,#dlg.mono .face{display:none}
#dlg.mono .txt{margin-left:40px;font-family:var(--f-serif);font-weight:400;color:var(--ink-soft)}
#dlg .opts{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin:-8px 26px 22px 160px}
#dlg .opts button{height:44px;padding:0 20px;border-radius:22px;border:3px solid var(--rim);background:#fff;color:var(--ink);font-size:15px;font-weight:500;box-shadow:0 4px 0 rgba(60,38,20,.3)}
#dlg .opts button:first-child{background:var(--leaf);color:#2f3a1f;font-weight:700;box-shadow:0 4px 0 var(--leaf-dk)}
#dlg .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink-soft)}
#view{position:fixed;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease;overflow:hidden;cursor:pointer}
#view.on{opacity:1;pointer-events:auto}
#view .img{position:absolute;inset:-4%;background:center/cover no-repeat;transform:scale(1.12) translate(-1.5%,1%);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
#view.on .img{transform:scale(1.02);animation:drift 26s ease-in-out 1.6s infinite alternate}
@keyframes drift{to{transform:scale(1.08) translate(1.5%,-1%)}}
#view .cap{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 18px;border-radius:16px;font-size:14px;color:var(--ink-soft);white-space:nowrap}
#view .sign{position:absolute;left:50%;top:0;transform:translateX(-50%)}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--night);color:#e8dcc4;font-family:var(--f-serif);font-size:18px;letter-spacing:3px}
@media (max-width:820px){#help{display:none}#modes{top:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px))}#modes button{padding:0 12px;font-size:14px}#dlg .txt,#dlg .opts{margin-left:24px}#dlg .face{width:56px;height:56px;top:0;bottom:auto}#dlg .tag{left:84px}#dlg .txt{margin-top:58px}.sign b{font-size:21px}}
@media (pointer:fine){#act{display:none}}
@media (prefers-reduced-motion:reduce){#place.swing{animation:none}#view .img{transition:none;animation:none}}
</style>

<canvas id="c" aria-label="乡野村的一角，可以走动"></canvas>
<div id="vig"></div>
<div id="place"><div class="ropes"><i></i><i></i></div><div class="sign wood"><small>乡野村</small><b id="placeName">村口小路</b></div></div>
<div id="modes" class="board" role="group" aria-label="画风">
  <button id="mA" aria-pressed="false">A · 像素风</button><button id="mB" aria-pressed="true">B · 手绘风</button>
</div>
<div id="help" class="board"><b>参考小样</b>：地图、小人都是代码临时画的，用来比较两种画风的感觉；正式版用 Gemini 出图。<br>方向键 / WASD 走路，Shift 跑，E 互动，也可以点地面走过去。1、2 切换画风。</div>
<div id="tip" class="board" hidden><kbd>E</kbd><span id="tipT"></span></div>
<button id="act" class="wood" hidden>互动</button>
<div id="dlg" class="mono"><div class="box board"></div><div class="tag wood">小路</div><div class="face" id="dface"></div><div class="txt" id="dt"></div><div class="opts" id="dopts"></div><div class="next" id="dnext">点击继续 ▸</div></div>
<div id="view" role="dialog" aria-label="看风景"><div class="img" id="vimg"></div><div class="sign wood" style="border-radius:0 0 10px 10px;border-top:none"><small>乡野村</small><b>石桥小溪</b></div><div class="cap board">站在桥上看了一会儿 · 点击或按 E 回去</div></div>

/* ---------- noise ---------- */
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vnoise(x,y)*.5+vnoise(x*2.1+5.2,y*2.1+3.1)*.3+vnoise(x*4.3+9.7,y*4.3+1.3)*.2}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mix3=(a,b,c,s)=>{s=clamp(s,0,1);return s<.5?mix(a,b,s*2):mix(b,c,(s-.5)*2)};

const T=16,MW=48,MH=32,WW=MW*T,WH=MH*T;

const sx=y=>21+2.6*Math.sin(y*.22+.6)+1.2*Math.sin(y*.53);

/* ---------- ground: pixel ---------- */
function buildPixelGround(){const c=mk(WW,WH),g=c.getContext('2d'),im=g.createImageData(WW,WH),D=im.data;

    if(t===G){const s=n+d*.18+(h-.5)*.06;k=s>.62?'gl':s<.42?'gd':'g'}
    else if(t===P){if(near(u+.5,v+.5,P,1.5))k='pe';else if(h<.012)k='pd2';else{const s=n+d*.2;k=s>.6?'pl':s<.4?'pd':'p'}}
    else if(t===W){if(near(u+.5,v+.5,W,1.6))k='we';else if(near(u+.5,v+.5,W,3.4))k='wl';else{const s=vnoise(u/9,v/2.5)+d*.25;k=s>.74?'wl':s<.3?'wd':'w'}}

  g.putImageData(im,0,0);
  const r=rng(11),px=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)};
  for(let n=0;n<900;n++){const u=Math.floor(r()*WW),v=Math.floor(r()*WH);if(jt(u,v)!==G||jt(u+3,v+3)!==G)continue;const q=r();
    if(q<.6){px(u,v+1,PX.gd);px(u+1,v,PX.gd);px(u+2,v+1,PX.gd);px(u+1,v+1,PX.gl)}
    else{const col=['#ffffff','#f7e27a','#f4a9c0','#c9b6f0'][Math.floor(r()*4)];px(u+1,v,col);px(u,v+1,col);px(u+2,v+1,col);px(u+1,v+2,col);px(u+1,v+1,'#f2c84b')}}
  for(let n=0;n<700;n++){const u=Math.floor(r()*WW),v=Math.floor(r()*WH);if(jt(u,v)!==G||!near(u,v,G,9)||tAt(u,v+12)===P)continue;let wet=false;for(const d of D8)if(jt(u+d[0]*8,v+d[1]*8)===W)wet=true;if(!wet)continue;
    g.fillStyle='#4a4a44';g.fillRect(u-1,v,6,4);g.fillStyle='#9d9a90';g.fillRect(u,v,4,3);g.fillStyle='#c2beb2';g.fillRect(u,v,2,1)}
  return c}

/* ---------- ground: painted ---------- */

  g.putImageData(im,0,0);g.scale(PS,PS);
  for(const t of TREES){const big=t.k==='camphor',rx=big?24:14,ry=big?8:5.5;const gr=g.createRadialGradient(t.x+3,t.y,0,t.x+3,t.y,rx);gr.addColorStop(0,'rgba(40,55,30,.32)');gr.addColorStop(1,'rgba(40,55,30,0)');g.save();g.translate(t.x+3,t.y);g.scale(1,ry/rx);g.translate(-t.x-3,-t.y);g.fillStyle=gr;g.fillRect(t.x+3-rx,t.y-rx,rx*2,rx*2);g.restore()}
  g.save();g.filter='blur(3px)';g.fillStyle='rgba(40,50,35,.28)';for(const h of HOUSES)g.fillRect(h.x*T+4,(h.y+h.h)*T-1,h.w*T+3,6);g.restore();
  const r=rng(11);

    if(q<.62){g.strokeStyle=`rgba(${70+r()*30|0},${110+r()*30|0},55,.75)`;g.lineWidth=.55;g.lineCap='round';g.beginPath();for(let i=-1;i<=1;i++){g.moveTo(u,v+2);g.quadraticCurveTo(u+i*1.2,v,u+i*2.2,v-2.4-r())}g.stroke()}
    else{const col=['255,255,255','250,226,120','246,168,192','205,186,240'][Math.floor(r()*4)];g.fillStyle=`rgba(${col},.95)`;for(let k=0;k<5;k++){const a=k*1.2566;g.beginPath();g.arc(u+Math.cos(a)*.9,v+Math.sin(a)*.9,.75,0,7);g.fill()}g.fillStyle='#e8b93a';g.beginPath();g.arc(u,v,.5,0,7);g.fill()}}
  for(let n=0;n<700;n++){const u=r()*WW,v=r()*WH;if(jt(u,v)!==G||tAt(u,v+12)===P)continue;let wet=false;for(const d of D8)if(jt(u+d[0]*8,v+d[1]*8)===W)wet=true;if(!wet)continue;
    const s=2+r()*2;const gg=g.createLinearGradient(u-s,v-s,u+s,v+s);gg.addColorStop(0,'#d6d1c4');gg.addColorStop(1,'#8f8a7e');g.fillStyle=gg;g.beginPath();g.ellipse(u,v,s*1.3,s*.85,0,0,7);g.fill();g.strokeStyle='rgba(74,53,35,.55)';g.lineWidth=.4;g.stroke()}

/* ---------- trees ---------- */
const TREEPAL={tree:['#3a6f2f','#4f8f3c','#6db04a','#26421f'],camphor:['#3d6c34','#558f40','#7cb653','#26421f'],willow:['#5f8f3a','#7cad4c','#a5cf6d','#36521f'],peach:['#d77f9c','#f2a7bf','#fbd3de','#7a3a4c']};
const TREEPA={tree:['#41703a','#5f9649','#93c46b'],camphor:['#3f6e3a','#5d944a','#98c775'],willow:['#6a9a45','#8fbd5f','#c3df8f'],peach:['#d98aa4','#f0aec3','#fde0e8']};
function canopy(kind){const big=kind==='camphor',sc=big?1.55:1,w=Math.round(42*sc),h=Math.round(54*sc),cx=w/2,cy=20*sc;

  return{w,h,cx,cy,sc,C,inC:(x,y)=>C.some(([a,b,r])=>(x-a)**2+(y-b)**2<r*r),ay:h-4}}
function pxTree(kind){const q=canopy(kind),c=mk(q.w,q.h),g=c.getContext('2d'),im=g.createImageData(q.w,q.h),D=im.data,pal=TREEPAL[kind].map(hex),tr=[hex('#5a3d26'),hex('#7a5536'),hex('#94693f'),hex('#2b2320')];

  for(let y=Math.round(q.cy+6*q.sc);y<q.ay;y++)for(let x=tx0;x<=tx1;x++)put(x,y,x===tx0||x===tx1?tr[3]:x<tx0+2?tr[0]:x>tx1-2?tr[2]:tr[1]);
  for(let x=tx0-2;x<=tx1+2;x++)put(x,q.ay-1,tr[3]);
  for(let y=0;y<q.h;y++)for(let x=0;x<q.w;x++){if(!q.inC(x+.5,y+.5))continue;const edge=!q.inC(x+1.5,y+.5)||!q.inC(x-.5,y+.5)||!q.inC(x+.5,y+1.5)||!q.inC(x+.5,y-.5);

const K=4;
function blob(g,x,y,r,col,a,rnd){g.fillStyle=col;g.globalAlpha=a;g.beginPath();const n=9;for(let i=0;i<=n;i++){const an=i/n*Math.PI*2,rr=r*(.78+rnd()*.38);const px=x+Math.cos(an)*rr,py=y+Math.sin(an)*rr*.9;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fill();g.globalAlpha=1}

  const ld=Math.hypot(HERO.x-LU.x,HERO.y-LU.y);LU.dir=ld<70&&Math.abs(HERO.x-LU.x)>Math.abs(HERO.y-LU.y)?(HERO.x>LU.x?2:3):0;
  let tip=null;if(ld<28)tip='talk';else if(tAt(HERO.x,HERO.y)===B)tip='view';PROMPT=tip;
  const nm=areaName(HERO.x,HERO.y);if(nm!==PLACE){PLACE=nm;$('#placeName').textContent=nm;const p=$('#place');p.classList.remove('swing');void p.offsetWidth;p.classList.add('swing')}
  const vw=innerWidth/S,vh=innerHeight/S;CAM.tx=clamp(HERO.x-vw/2,0,WW-vw);CAM.ty=clamp(HERO.y-14-vh/2,0,WH-vh);
  const k=1-Math.pow(.004,dt);CAM.x+=(CAM.tx-CAM.x)*k;CAM.y+=(CAM.ty-CAM.y)*k;
  stepFx(dt,t)}
let PROMPT=null,PLACE='村口小路';const CAM={x:0,y:0,tx:0,ty:0};
function areaName(x,y){const tx=x/T,ty=y/T;if(Math.abs(tx-sx(ty))<6)return'石桥小溪';if(tx>26&&ty>18)return'田埂';if(tx>26&&ty<14)return'老街人家';if(tx<16&&ty<13)return'油菜花田';return'村口小路'}
function interact(){if(PROMPT==='talk')talkLu();else if(PROMPT==='view')openView()}

/* ---------- fx ---------- */
const SPK=[],PET=[];
function waterSpot(){for(let i=0;i<50;i++){const u=Math.random()*WW,v=Math.random()*WH;const t=tAt(u,v);if(t===W||(t===R&&Math.random()<.25))return[u,v,t]}return[0,0,G]}
for(let i=0;i<190;i++){const [u,v,t]=waterSpot();SPK.push({u,v,t,a:Math.random()*6,l:1+Math.random()*3})}
function stepFx(dt,t){for(const s of SPK){s.a+=dt;if(s.t===W){s.v+=dt*11;s.u+=(sx((s.v+dt*11)/T)-sx(s.v/T))*T}if(s.a>s.l||tAt(s.u,s.v)!==s.t){const [u,v,tt]=waterSpot();Object.assign(s,{u,v,t:tt,a:0,l:1+Math.random()*3})}}
  const peaches=TREES.filter(t=>t.k==='peach');if(PET.length<60&&Math.random()<dt*14){const p=peaches[Math.floor(Math.random()*peaches.length)];PET.push({x:p.x+(Math.random()-.5)*26,y:p.y-34+Math.random()*16,vx:6+Math.random()*8,vy:5+Math.random()*5,l:5+Math.random()*4,a:0,p:Math.random()*6})}
  for(const p of PET){p.a+=dt;p.x+=(p.vx+Math.sin(t*2+p.p)*6)*dt;p.y+=p.vy*dt}for(let i=PET.length-1;i>=0;i--)if(PET[i].a>PET[i].l)PET.splice(i,1)}

/* ---------- render ---------- */
let MODE='B',S=3,DPR=1;const ctx=cv.getContext('2d');let LC=null,LG=null;
function resize(){DPR=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);S=Math.max(2,Math.round(innerHeight/250));if(innerWidth<600)S=Math.max(2,Math.round(innerWidth/150));
  LC=mk(Math.ceil(innerWidth/S)+2,Math.ceil(innerHeight/S)+2);LG=LC.getContext('2d')}
addEventListener('resize',resize);
function objects(painted,t){const L=[];const sel=o=>painted?o.pt:o.px;
  for(const tr of SPR.trees){const s=sel(tr);L.push({y:tr.t.y,tree:tr,s})}
  for(const h of SPR.houses){const s=sel(h);L.push({y:(h.h.y+h.h.h)*T-1,s,house:true})}
  L.push({y:15*T-.5,par:SPR.par.n[painted?1:0]});L.push({y:17*T+.5,par:SPR.par.s[painted?1:0]});
  L.push({y:HERO.y,hero:true});L.push({y:LU.y,lu:true});return L.sort((a,b)=>a.y-b.y)}
function behind(tr,s){const x0=tr.t.x-s.ax,y0=tr.t.y-s.ay;return HERO.x>x0+4&&HERO.x<x0+s.w-4&&HERO.y<tr.t.y-2&&HERO.y>y0+6}
function renderPixel(t){const g=LG,cx=Math.round(CAM.x),cy=Math.round(CAM.y),vw=LC.width,vh=LC.height;g.imageSmoothingEnabled=false;g.clearRect(0,0,vw,vh);
  g.drawImage(SPR.pxGround,cx,cy,vw,vh,0,0,vw,vh);
  for(const s of SPK){const a=Math.sin(s.a/s.l*Math.PI);if(a<.3)continue;g.fillStyle=a>.75?'#ffffff':'#c9ecf7';g.fillRect(Math.round(s.u-cx),Math.round(s.v-cy),s.t===W?2:1,1)}
  for(const o of objects(false,t)){
    if(o.tree){const s=o.s;g.globalAlpha=behind(o.tree,s)?.55:1;g.drawImage(s.c,Math.round(o.tree.t.x-s.ax-cx),Math.round(o.tree.t.y-s.ay-cy));g.globalAlpha=1}
    else if(o.house){const s=o.s;g.drawImage(s.c,s.ax-cx,s.ay-cy)}
    else if(o.par){g.drawImage(o.par.c,o.par.x-cx,o.par.y-cy)}
    else if(o.hero){const d=HERO.dir===3?2:HERO.dir,f=HERO.mov?Math.floor(HERO.ph/1.6)%4:0,img=PXH[d][f],x=Math.round(HERO.x-cx),y=Math.round(HERO.y-cy);
      g.fillStyle='rgba(30,40,20,.25)';g.fillRect(x-5,y-1,10,2);g.fillRect(x-4,y,8,1);
      if(HERO.dir===3){g.save();g.translate(x,0);g.scale(-1,1);g.drawImage(img,-9,y-26);g.restore()}else g.drawImage(img,x-9,y-26)}
    else if(o.lu){const f=Math.floor(t*1.6)%2,img=PXL[f][LU.dir?1:0],x=Math.round(LU.x-cx),y=Math.round(LU.y-cy);g.fillStyle='rgba(30,40,20,.25)';g.fillRect(x-5,y-1,10,2);
      if(LU.dir===3){g.save();g.translate(x,0);g.scale(-1,1);g.drawImage(img,-9,y-26);g.restore()}else g.drawImage(img,x-9,y-26)}}
  for(const p of PET){g.fillStyle='#f7b6c9';g.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),2,1)}
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;const sc=S*DPR;ctx.drawImage(LC,-(CAM.x-cx)*sc,-(CAM.y-cy)*sc,vw*sc,vh*sc)}
function renderPaint(t){const g=ctx,sc=S*DPR;g.setTransform(sc,0,0,sc,-CAM.x*sc,-CAM.y*sc);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  const vw=innerWidth/S+2,vh=innerHeight/S+2,x0=Math.max(0,CAM.x-1),y0=Math.max(0,CAM.y-1);g.drawImage(SPR.ptGround,x0*PS,y0*PS,Math.min(vw,WW-x0)*PS,Math.min(vh,WH-y0)*PS,x0,y0,Math.min(vw,WW-x0),Math.min(vh,WH-y0));
  g.lineCap='round';for(const s of SPK){const a=Math.sin(s.a/s.l*Math.PI);if(s.t===W){g.strokeStyle=`rgba(255,255,255,${.55*a})`;g.lineWidth=.7;g.beginPath();g.moveTo(s.u-1.6,s.v);g.lineTo(s.u+1.6,s.v+.4);g.stroke()}else{g.fillStyle=`rgba(255,255,255,${.6*a})`;g.beginPath();g.arc(s.u,s.v,.6,0,7);g.fill()}}
  for(const o of objects(true,t)){
    if(o.tree){const s=o.s,sway=Math.sin(t*1.1+o.tree.t.x*.05)*.012;g.save();g.globalAlpha=behind(o.tree,s)?.55:1;g.translate(o.tree.t.x,o.tree.t.y);g.transform(1,0,sway,1,0,0);g.drawImage(s.c,-s.ax,-s.ay,s.w,s.h);g.restore()}
    else if(o.house){const s=o.s;g.drawImage(s.c,s.ax,s.ay,s.sw,s.sh)}
    else if(o.par){g.drawImage(o.par.c,o.par.x,o.par.y,o.par.len,o.par.hgt)}
    else if(o.hero){g.save();g.translate(HERO.x,HERO.y);drawHeroP(g,HERO.dir,HERO.ph*.7,HERO.mov,t);g.restore()}
    else if(o.lu){g.save();g.translate(LU.x,LU.y);drawLuP(g,LU.dir,t);g.restore()}}
  for(const p of PET){g.save();g.translate(p.x,p.y);g.rotate(t*2+p.p);g.scale(1,.5+.5*Math.sin(t*3+p.p));g.fillStyle='rgba(248,190,208,.95)';g.beginPath();g.ellipse(0,0,1.4,.85,0,0,7);g.fill();g.restore()}
  for(let i=0;i<3;i++){const cx=((t*6+i*310)%(WW+300))-150,cy=120+i*150+Math.sin(t*.05+i)*40;const gr=g.createRadialGradient(cx,cy,0,cx,cy,110);gr.addColorStop(0,'rgba(30,45,70,.10)');gr.addColorStop(1,'rgba(30,45,70,0)');g.fillStyle=gr;g.fillRect(cx-110,cy-110,220,220)}}
function render(t){if(MODE==='A')renderPixel(t);else renderPaint(t);
  const tip=$('#tip');if(PROMPT&&!DLG.open&&!VIEW.open){tip.hidden=false;$('#tipT').textContent=PROMPT==='talk'?(LU.met?'和小路说话':'跟桥边的女孩打招呼'):'站在桥上看风景';const px=PROMPT==='talk'?LU:HERO;tip.style.left=((px.x-CAM.x)*S)+'px';tip.style.top=((px.y-34-CAM.y)*S)+'px';$('#act').hidden=false}else{tip.hidden=true;$('#act').hidden=true}}
function setMode(m){MODE=m;$('#mA').setAttribute('aria-pressed',String(m==='A'));$('#mB').setAttribute('aria-pressed',String(m==='B'));$('#vig').style.opacity=m==='B'?1:0}
$('#mA').onclick=()=>setMode('A');$('#mB').onclick=()=>setMode('B');$('#act').onclick=interact;$('#tip').onclick=interact;

/* ---------- voice + dialogue ---------- */
const VO={ctx:null,base:440};const FORM=[[800,1150],[400,1600],[300,2300],[450,800],[350,700]];
function voInit(){if(VO.ctx)return;try{VO.ctx=new(window.AudioContext||window.webkitAudioContext)();VO.out=VO.ctx.createGain();VO.out.gain.value=.85;VO.out.connect(VO.ctx.destination)}catch(e){}}
function syllable(ch,q){const A_=VO.ctx;if(!A_)return;const c=ch.charCodeAt(0),t=A_.currentTime,f0=VO.base*(1+((c%7)-3)*.035)*(q?1.12:1),fm=FORM[c%5];const gn=A_.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.16,t+.012);gn.gain.exponentialRampToValueAtTime(.001,t+.085);gn.connect(VO.out);
  for(const [type,mul,vol] of[['sawtooth',1,1],['triangle',2,.4]]){const o=A_.createOscillator();o.type=type;o.frequency.setValueAtTime(f0*mul,t);o.frequency.exponentialRampToValueAtTime(f0*mul*(q?1.08:.94),t+.08);const v=A_.createGain();v.gain.value=vol;o.connect(v);for(const [ff,qq] of[[fm[0],6],[fm[1],9]]){const bp=A_.createBiquadFilter();bp.type='bandpass';bp.frequency.value=ff;bp.Q.value=qq;v.connect(bp);bp.connect(gn)}o.start(t);o.stop(t+.1)}}
const DLG={open:false,skip:()=>{}};
function say(lines){return new Promise(res=>{const d=$('#dlg'),tx=$('#dt'),op=$('#dopts');let i=0,iv=0;DLG.open=true;d.style.display='block';
  const next=()=>{clearInterval(iv);if(i>=lines.length){d.style.display='none';DLG.open=false;res();return}const L=lines[i++],who=L.who,text=L.text||L;let k=0;op.innerHTML='';d.classList.toggle('mono',!who);tx.textContent='';$('#dnext').hidden=!!L.choices;const q=/？$/.test(text);
    const done=()=>{clearInterval(iv);tx.textContent=text;k=text.length;if(L.choices){L.choices.forEach(c=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=e=>{e.stopPropagation();lines.splice(i,0,...c.then);next()};op.appendChild(b)});setTimeout(()=>op.firstChild&&op.firstChild.focus(),30)}};
    iv=setInterval(()=>{const ch=text[k++];tx.textContent=text.slice(0,k);if(who&&ch&&!/[，。？！、…—\s]/.test(ch))syllable(ch,q&&k>text.length-4);if(k>=text.length)done()},who?75:40);
    DLG.skip=()=>{if(k<text.length){done();return}if(!L.choices)next()}};next()})}
$('#dlg').addEventListener('click',()=>DLG.skip());
async function talkLu(){if(DLG.open)return;KEYS.clear();TARGET=null;const L=t=>({who:'小路',text:t});
  if(!LU.met){LU.met=true;await say(['桥边站着一个戴草帽的小女孩，正盯着溪水看。',L('嘘——溪里有鱼。'),{who:'小路',text:'你是新来的吧？',choices:[
    {label:'嗯，今天刚到。',then:[L('那你一定要站到桥上看看，从那里看整条小溪最好看！')]},
    {label:'你在这里做什么？',then:[L('等鱼游过来呀。站到桥上看得更清楚，你去试试！')]}]}])}
  else await say([L(['看到鱼了吗？','我家就在老街那边。','明天还来这里吗？'][Math.floor(Math.random()*3)])])}
const VIEW={open:false};
function openView(){VIEW.open=true;KEYS.clear();TARGET=null;$('#view').classList.add('on')}
function closeView(){VIEW.open=false;$('#view').classList.remove('on')}
$('#view').addEventListener('click',closeView);

/* ---------- boot ---------- */
$('#dface').style.backgroundImage=`url(${A.lu_face})`;$('#vimg').style.backgroundImage=`url(${A.shiqiao})`;
let last=performance.now(),TT=0;
function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;TT+=dt;update(dt,TT);render(TT);requestAnimationFrame(frame)}
setTimeout(()=>{try{buildAll();resize();const vw=innerWidth/S,vh=innerHeight/S;CAM.x=clamp(HERO.x-vw/2,0,WW-vw);CAM.y=clamp(HERO.y-14-vh/2,0,WH-vh);$('#load').hidden=true;requestAnimationFrame(frame)}catch(e){$('#load').textContent='画村子时出错了：'+e.message;throw e}},30);
window.__dbg={HERO,LU,CAM,setMode,openView,talkLu,get mode(){return MODE}};
</script>
