<title>乡野村 · 俯视角小样</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Same option-C "country boards" UI as the card page, laid over a top-down village that can be drawn as pixel art (A) or hand-painted (B). */
:root{--cream:#fff7e6;--rim:#5e4027;--ink:#4a3523;--ink-soft:#7a5d40;--leaf:#8fbf6a;--leaf-dk:#5e7d44;--night:#1d1a14;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:var(--f-sans);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(60,40,20,.28));transition:opacity .4s}
.board{background:var(--cream);border:3px solid var(--rim);box-shadow:0 5px 0 rgba(60,38,20,.3)}
.wood{background-color:#9a6b43;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,transparent 2px,transparent 9px),linear-gradient(180deg,#a8774c,#86592f);border:3px solid var(--rim);color:#fff4dd}
button{font-family:var(--f-sans);cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
#place{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:0;z-index:5;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
#place.swing{animation:swing 1.3s ease-out}
@keyframes swing{0%{transform:rotate(6deg)}35%{transform:rotate(-4deg)}65%{transform:rotate(2deg)}100%{transform:none}}
.ropes{display:flex;justify-content:space-around;width:70%}.ropes i{display:block;width:3px;height:18px;background:var(--rim)}
.sign{padding:5px 20px 9px;border-radius:10px;box-shadow:0 6px 0 rgba(60,38,20,.35);text-align:center;min-width:110px}
.sign small{display:block;font-size:12px;letter-spacing:4px;opacity:.85}
.sign b{display:block;font-family:var(--f-serif);font-weight:600;font-size:26px;letter-spacing:4px;text-shadow:0 2px 0 var(--rim);white-space:nowrap}
#stages{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;padding:5px;gap:4px;border-radius:30px;max-width:calc(100% - 32px);overflow-x:auto}
#stages span{font-family:var(--f-serif);font-weight:600;font-size:15px;padding:0 8px 0 12px;white-space:nowrap}
#stages button{height:42px;padding:0 18px;border-radius:21px;border:none;background:transparent;color:var(--ink-soft);font-size:15px;font-weight:700;white-space:nowrap}
#stages button[aria-pressed="true"]{background:var(--leaf);color:#2f3a1f;box-shadow:inset 0 0 0 2px var(--rim)}
#help{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));z-index:5;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.7;max-width:240px;color:var(--ink-soft)}
#help b{color:var(--ink)}
#tip{position:fixed;z-index:6;padding:6px 14px 6px 6px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;transform:translate(-50%,-100%);cursor:pointer;white-space:nowrap}
#tip::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--rim);border-bottom:0}
#tip kbd{width:24px;height:24px;border-radius:8px;background:var(--rim);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--f-sans)}
#act{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6;width:72px;height:72px;border-radius:50%;font-size:17px;font-weight:700;box-shadow:0 5px 0 rgba(60,38,20,.35)}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(880px,calc(100% - 32px));min-height:160px;display:none;z-index:7}
#dlg .box{position:absolute;inset:18px 0 0 0;border-radius:26px}
#dlg .tag{position:absolute;left:150px;top:0;padding:5px 20px 6px;border-radius:12px;font-family:var(--f-serif);font-size:20px;letter-spacing:4px}
#dlg .face{position:absolute;left:18px;bottom:16px;width:112px;height:112px;border-radius:50%;border:4px solid var(--rim);box-shadow:0 0 0 4px var(--cream);background:var(--cream) center/cover no-repeat}
#dlg .txt{position:relative;margin:52px 30px 24px 160px;font-size:19px;line-height:1.7;font-weight:500;min-height:60px}
#dlg.mono .tag,#dlg.mono .face{display:none}
#dlg.mono .txt{margin-left:40px;font-family:var(--f-serif);font-weight:400;color:var(--ink-soft)}
#dlg .opts{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin:-8px 26px 22px 160px}
#dlg .opts button{height:44px;padding:0 20px;border-radius:22px;border:3px solid var(--rim);background:#fff;color:var(--ink);font-size:15px;font-weight:500;box-shadow:0 4px 0 rgba(60,38,20,.3)}
#dlg .opts button:first-child{background:var(--leaf);color:#2f3a1f;font-weight:700;box-shadow:0 4px 0 var(--leaf-dk)}
#dlg .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink-soft)}
#view{position:fixed;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease;overflow:hidden;cursor:pointer}
#view.on{opacity:1;pointer-events:auto}
#view .img{position:absolute;inset:-4%;background:center/cover no-repeat;transform:scale(1.12) translate(-1.5%,1%);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
#view.on .img{transform:scale(1.02);animation:drift 26s ease-in-out 1.6s infinite alternate}
@keyframes drift{to{transform:scale(1.08) translate(1.5%,-1%)}}
#view .cap{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 18px;border-radius:16px;font-size:14px;color:var(--ink-soft);white-space:nowrap}
#view .sign{position:absolute;left:50%;top:0;transform:translateX(-50%)}
#load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--night);color:#e8dcc4;font-family:var(--f-serif);font-size:18px;letter-spacing:3px}
@media (max-width:820px){#help{display:none}#stages{top:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));justify-content:flex-start}#stages button{padding:0 12px;font-size:14px}#dlg .txt,#dlg .opts{margin-left:24px}#dlg .face{width:56px;height:56px;top:0;bottom:auto}#dlg .tag{left:84px}#dlg .txt{margin-top:58px}.sign b{font-size:21px}}
@media (pointer:fine){#act{display:none}}
@media (prefers-reduced-motion:reduce){#place.swing{animation:none}#view .img{transition:none;animation:none}}
</style>

<canvas id="c" aria-label="乡野村的一角，可以走动"></canvas>
<div id="vig"></div>
<div id="place"><div class="ropes"><i></i><i></i></div><div class="sign wood"><small>乡野村</small><b id="placeName">村口小路</b></div></div>
<div id="stages" class="board" role="group" aria-label="稻田的季节"></div>
<div id="help" class="board"><b>参考小样</b>：地图是代码临时画的；人物用的是之前 Gemini 生成的设定图（村民是海边版草稿，临时借用）。<br>方向键 / WASD 走路，Shift 跑，E 互动，也可以点地面走过去。1–5 切换稻田的季节。</div>
<div id="tip" class="board" hidden><kbd>E</kbd><span id="tipT"></span></div>
<button id="act" class="wood" hidden>互动</button>
<div id="dlg" class="mono"><div class="box board"></div><div class="tag wood" id="dtag">小路</div><div class="face" id="dface"></div><div class="txt" id="dt"></div><div class="opts" id="dopts"></div><div class="next" id="dnext">点击继续 ▸</div></div>

const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c};

/* ---------- map ---------- */

for(let x=30;x<40;x++)set(x,7,P);for(let x=36;x<41;x++)for(const y of[13,14])set(x,y,P);

/* objects: trees */
const TREES=[];{const r=rng(7);const ok=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(at(x+i,y+j)!==G)return false;return y<13||y>18};

  add(17,12,'willow');add(21,22,'willow');add(25,12,'peach');add(15,20,'peach');add(6,20,'camphor');add(44,16.6,'peach');
  for(let n=0;n<400&&TREES.length<48;n++){const edge=r()<.7;let x=Math.floor(r()*MW),y=Math.floor(r()*MH);if(edge){const s=Math.floor(r()*4);if(s===0)y=Math.floor(r()*2);else if(s===1)y=MH-1-Math.floor(r()*2);else if(s===2)x=Math.floor(r()*2);else x=MW-1-Math.floor(r()*2)}

/* ---------- trees ---------- */
const TREEPAL={tree:['#3a6f2f','#4f8f3c','#6db04a','#26421f'],camphor:['#3d6c34','#558f40','#7cb653','#26421f'],willow:['#5f8f3a','#7cad4c','#a5cf6d','#36521f'],peach:['#d77f9c','#f2a7bf','#fbd3de','#7a3a4c']};
const TREEPA={tree:['#41703a','#5f9649','#93c46b'],camphor:['#3f6e3a','#5d944a','#98c775'],willow:['#6a9a45','#8fbd5f','#c3df8f'],peach:['#d98aa4','#f0aec3','#fde0e8']};
function canopy(kind){const big=kind==='camphor',sc=big?1.55:1,w=Math.round(42*sc),h=Math.round(54*sc),cx=w/2,cy=20*sc;
  const C=[[0,0,13],[-9,4,9.5],[9,4,9.5],[-5,-7,9.5],[6,-6,9.5],[0,7,9]].map(a=>[cx+a[0]*sc,cy+a[1]*sc,a[2]*sc]);
  return{w,h,cx,cy,sc,C,inC:(x,y)=>C.some(([a,b,r])=>(x-a)**2+(y-b)**2<r*r),ay:h-4}}
function pxTree(kind){const q=canopy(kind),c=mk(q.w,q.h),g=c.getContext('2d'),im=g.createImageData(q.w,q.h),D=im.data,pal=TREEPAL[kind].map(hex),tr=[hex('#5a3d26'),hex('#7a5536'),hex('#94693f'),hex('#2b2320')];
  const put=(x,y,col)=>{if(x<0||y<0||x>=q.w||y>=q.h)return;const o=(y*q.w+x)*4;D[o]=col[0];D[o+1]=col[1];D[o+2]=col[2];D[o+3]=255};
  const tx0=Math.round(q.cx-3*q.sc),tx1=Math.round(q.cx+3*q.sc);
  for(let y=Math.round(q.cy+6*q.sc);y<q.ay;y++)for(let x=tx0;x<=tx1;x++)put(x,y,x===tx0||x===tx1?tr[3]:x<tx0+2?tr[0]:x>tx1-2?tr[2]:tr[1]);
  for(let x=tx0-2;x<=tx1+2;x++)put(x,q.ay-1,tr[3]);
  for(let y=0;y<q.h;y++)for(let x=0;x<q.w;x++){if(!q.inC(x+.5,y+.5))continue;const edge=!q.inC(x+1.5,y+.5)||!q.inC(x-.5,y+.5)||!q.inC(x+.5,y+1.5)||!q.inC(x+.5,y-.5);
    if(edge){put(x,y,pal[3]);continue}const s=((x-q.cx)*-.55+(y-q.cy)*-.85)/(14*q.sc)+(vnoise(x/3.5,y/3.5)-.5)*.7+(BAY[(x&3)+((y&3)<<2)]/16-.47)*.35;put(x,y,s>.35?pal[2]:s<-.3?pal[0]:pal[1])}
  if(kind==='willow')for(let x=Math.round(q.cx-14);x<q.cx+14;x+=3){let y0=0;for(let y=q.h-1;y>0;y--)if(q.inC(x+.5,y+.5)){y0=y;break}if(!y0)continue;const L=8+Math.floor(hash2(x,9)*9);for(let y=y0;y<y0+L&&y<q.ay-3;y++)put(x,y,y%3?pal[1]:pal[0])}
  if(kind==='peach')for(let n=0;n<30;n++){const x=Math.floor(hash2(n,3)*q.w),y=Math.floor(hash2(n,7)*q.h);if(q.inC(x,y)&&q.inC(x+2,y+2))put(x,y,hex('#ffffff'))}
  g.putImageData(im,0,0);return{c,ax:q.cx,ay:q.ay,w:q.w,h:q.h,can:q}}
const K=4;
function blob(g,x,y,r,col,a,rnd){g.fillStyle=col;g.globalAlpha=a;g.beginPath();const n=9;for(let i=0;i<=n;i++){const an=i/n*Math.PI*2,rr=r*(.78+rnd()*.38);const px=x+Math.cos(an)*rr,py=y+Math.sin(an)*rr*.9;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fill();g.globalAlpha=1}
function ptTree(kind,seed){const q=canopy(kind),c=mk(q.w*K,q.h*K),g=c.getContext('2d');g.scale(K,K);const r=rng(seed),pal=TREEPA[kind];
  g.lineJoin='round';g.lineCap='round';
  const tw=3*q.sc;g.fillStyle='#7a5a3c';g.beginPath();g.moveTo(q.cx-tw,q.ay);g.quadraticCurveTo(q.cx-tw*.6,q.cy+10*q.sc,q.cx-tw*.5,q.cy);g.lineTo(q.cx+tw*.5,q.cy);g.quadraticCurveTo(q.cx+tw*.6,q.cy+10*q.sc,q.cx+tw*1.1,q.ay);g.closePath();g.fill();

  const pick=f=>{for(let i=0;i<60;i++){const x=q.cx+(r()-.5)*q.w*.9,y=q.cy+(r()-.5)*q.h*.7;if(q.inC(x,y)&&f(x,y))return[x,y]}return[q.cx,q.cy]};
  for(let i=0;i<34;i++){const [x,y]=pick(()=>true);blob(g,x+1.4,y+2,(4.5+r()*3.5)*q.sc,pal[0],.92,r)}
  for(let i=0;i<34;i++){const [x,y]=pick((x,y)=>(x-q.cx)*.5+(y-q.cy)<8*q.sc);blob(g,x,y,(4+r()*3.2)*q.sc,pal[1],.85,r)}
  for(let i=0;i<20;i++){const [x,y]=pick((x,y)=>(x-q.cx)*.6+(y-q.cy)<-3*q.sc);blob(g,x-.5,y-.5,(2.4+r()*2.6)*q.sc,pal[2],.75,r)}

  g.strokeStyle='rgba(40,60,30,.35)';g.lineWidth=.5;for(let i=0;i<14;i++){const [x,y]=pick(()=>true);g.beginPath();g.arc(x,y,2+r()*2,.3,1.8);g.stroke()}

/* ---------- characters: painted sheets, puppet-animated ---------- */
const CH={};
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function loadChars(){const defs={hero_front:[40,.555],hero_side:[40,.555],hero_back:[40,.555],lin:[38,.6],lu:[28,.79],ayi:[35,.8],azhen:[37,.64],cat:[18,1]};
  for(const k in defs){const img=await loadImg(A['c_'+k]);const d=mk(img.width,img.height),g=d.getContext('2d');g.filter='brightness(.7)';g.drawImage(img,0,0);CH[k]={img,dark:d,h:defs[k][0],hip:defs[k][1],w:img.width/img.height*defs[k][0]}}}
/* one painted image → walking figure: upper body bobs and sways; legs either stretch alternately (front/back) or scissor around the hip (side) */
function drawPuppet(g,P,o){const img=P.img,h=P.h,w=P.w,iw=img.width,ih=img.height,hy=-h*(1-P.hip),sy=ih*P.hip,lh=h*(1-P.hip),ov=.035;
  g.fillStyle='rgba(40,35,20,.22)';g.beginPath();g.ellipse(0,0,w*.36,Math.max(2,w*.12),0,0,7);g.fill();
  g.save();if(o.flip)g.scale(-1,1);
  const bend=o.bend||0;
  if(!o.mov&&bend<.01){g.scale(1,1+Math.sin(o.t*2.2+(o.seed||0))*.008);g.drawImage(img,-w/2,-h,w,h);g.restore();return}
  const s=o.mov?Math.sin(o.ph):0,bob=o.mov?-Math.abs(s)*h*.02:0;
  if(o.mov&&o.side){const th=.36*s;for(const [im,a] of[[P.dark,th],[img,-th]]){g.save();g.translate(0,hy);g.rotate(a);g.drawImage(im,0,sy,iw,ih-sy,-w/2,0,w,lh);g.restore()}}
  else if(o.mov){for(const sd of[-1,1]){g.save();g.translate(0,hy);g.scale(1,1+.075*sd*s);g.drawImage(img,sd<0?0:iw/2,sy,iw/2,ih-sy,sd<0?-w/2:0,0,w/2,lh);g.restore()}}
  else g.drawImage(img,0,sy,iw,ih-sy,-w/2,hy,w,lh);
  g.translate(0,hy+bob);g.rotate(s*.022+bend*.05);g.scale(1,1-bend*.13);
  g.drawImage(img,0,0,iw,sy+ih*ov,-w/2,-h*P.hip,w,h*(P.hip+ov));
  g.restore()}

/* ---------- NPCs and animals ---------- */
const HERO={x:3*T,y:16*T,dir:0,ph:0,mov:false,run:false};
const RROWS=[25,32],RCOLS=[35,44,53,62];
const NPCS=[
  {id:'lu',name:'小路',spr:'lu',face:'lu_face',x:24*T,y:19*T,home:[21.5*T,17.7*T,27*T,21.5*T],speed:30},
  {id:'lin',name:'老林',spr:'lin',face:'f_lin',x:35*T+8,y:25*T+10,ridge:true,speed:20},
  {id:'ayi',name:'阿姨',spr:'ayi',face:'f_ayi',x:33*T,y:9*T,home:[30*T,8*T,41*T,12.6*T],speed:18},
  {id:'azhen',name:'阿珍',spr:'azhen',face:'f_azhen',x:9*T,y:16*T,path:true,speed:28}];
for(const n of NPCS)Object.assign(n,{state:'idle',wait:1+Math.random()*2,ph:0,mov:false,flip:false,bend:0,seed:Math.random()*6,met:false});
const CAT={x:14*T+8,y:13*T+10};
const DUCKS=[0,1,2].map(i=>({v:(5+i*3)*T,off:(i-1)*7,dir:i%2?1:-1,ph:i*2}));
const HENS=[0,1,2,3].map(i=>({x:(32+i*2)*T,y:(8.5+(i%2)*2.5)*T,tx:0,ty:0,wait:i,peck:0,flip:i%2===0,col:i===2?'#b87a45':'#f4efe4'}));
function pickTarget(n){
  if(n.ridge){const tx=Math.floor(n.x/T),ty=Math.floor(n.y/T),onRow=RROWS.includes(ty),onCol=RCOLS.includes(tx);
    if(onRow&&(!onCol||Math.random()<.5)){n.ty=ty*T+10;n.y=n.ty;n.tx=(Math.random()<.6?RCOLS[Math.floor(Math.random()*4)]:28+Math.floor(Math.random()*34))*T+8}
    else{n.tx=tx*T+8;n.x=n.tx;n.ty=(Math.random()<.6?RROWS[Math.floor(Math.random()*2)]:19+Math.floor(Math.random()*20))*T+10}return}
  if(n.path){n.tx=(2+Math.random()*58)*T;n.ty=(15.3+Math.random()*1.4)*T;return}
  for(let i=0;i<40;i++){const x=n.home[0]+Math.random()*(n.home[2]-n.home[0]),y=n.home[1]+Math.random()*(n.home[3]-n.home[1]);if(free(x,y)){n.tx=x;n.ty=y;return}}n.tx=n.x;n.ty=n.y}
function npcStep(n,dt){n.bend+=((n.state==='work'?1:0)-n.bend)*(1-Math.pow(.02,dt));
  if(n.talking){n.mov=false;n.state='idle';n.flip=HERO.x>n.x;return}
  const dp=Math.hypot(HERO.x-n.x,HERO.y-n.y);
  if(dp<30&&!HERO.mov&&n.state!=='work'){n.mov=false;n.state='idle';n.wait=Math.max(n.wait,1.2);n.flip=HERO.x>n.x;return}
  n.wait-=dt;

const VO={ctx:null};const FORM=[[800,1150],[400,1600],[300,2300],[450,800],[350,700]];const PITCH={'小路':470,'老林':150,'阿姨':300,'阿珍':360};
function voInit(){if(VO.ctx)return;try{VO.ctx=new(window.AudioContext||window.webkitAudioContext)();VO.out=VO.ctx.createGain();VO.out.gain.value=.85;VO.out.connect(VO.ctx.destination)}catch(e){}}
function syllable(ch,q,base){const A_=VO.ctx;if(!A_)return;const c=ch.charCodeAt(0),t=A_.currentTime,f0=base*(1+((c%7)-3)*.035)*(q?1.12:1),fm=FORM[c%5];const gn=A_.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.16,t+.012);gn.gain.exponentialRampToValueAtTime(.001,t+.085);gn.connect(VO.out);
  for(const [type,mul,vol] of[['sawtooth',1,1],['triangle',2,.4]]){const o=A_.createOscillator();o.type=type;o.frequency.setValueAtTime(f0*mul,t);o.frequency.exponentialRampToValueAtTime(f0*mul*(q?1.08:.94),t+.08);const v=A_.createGain();v.gain.value=vol;o.connect(v);for(const [ff,qq] of[[fm[0],6],[fm[1],9]]){const bp=A_.createBiquadFilter();bp.type='bandpass';bp.frequency.value=ff;bp.Q.value=qq;v.connect(bp);bp.connect(gn)}o.start(t);o.stop(t+.1)}}
const DLG={open:false,skip:()=>{}};const FACE={'小路':'lu_face','老林':'f_lin','阿姨':'f_ayi','阿珍':'f_azhen'};
function say(lines){return new Promise(res=>{const d=$('#dlg'),tx=$('#dt'),op=$('#dopts');let i=0,iv=0;DLG.open=true;d.style.display='block';KEYS.clear();TARGET=null;
  const next=()=>{clearInterval(iv);if(i>=lines.length){d.style.display='none';DLG.open=false;res();return}const L=lines[i++],who=L.who,text=L.text||L;let k=0;op.innerHTML='';d.classList.toggle('mono',!who);
    if(who){$('#dtag').textContent=who;$('#dface').style.backgroundImage=`url(${A[FACE[who]]})`}tx.textContent='';$('#dnext').hidden=!!L.choices;const q=/？$/.test(text);
    const done=()=>{clearInterval(iv);tx.textContent=text;k=text.length;if(L.choices){L.choices.forEach(c=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=e=>{e.stopPropagation();lines.splice(i,0,...c.then);next()};op.appendChild(b)});setTimeout(()=>op.firstChild&&op.firstChild.focus(),30)}};
    iv=setInterval(()=>{const ch=text[k++];tx.textContent=text.slice(0,k);if(who&&ch&&!/[，。？！、…—\s（）]/.test(ch))syllable(ch,q&&k>text.length-4,PITCH[who]);if(k>=text.length)done()},who?75:40);
    DLG.skip=()=>{if(k<text.length){done();return}if(!L.choices)next()}};next()})}
$('#dlg').addEventListener('click',()=>DLG.skip());
const RICE_TALK=['刚插下去的秧，得护着点，别踩进田里。','这会儿秧苗长得最快，一天一个样。','抽穗了，再晒一个月就能割。','黄了！这几天就得开镰，村里人手不够呀。','割完了，稻草捆起来留着过冬。'];
async function talk(n){if(DLG.open)return;n.talking=true;const L=t=>({who:n.name,text:t});const first=!n.met;n.met=true;
  if(n.id==='lu'){if(first)await say(['桥边有个戴草帽的小女孩，正蹲着看溪水。',L('嘘——溪里有鱼。'),{who:'小路',text:'你是新来的吧？',choices:[{label:'嗯，今天刚到。',then:[L('那你一定要站到桥上看看，从那里看整条小溪最好看！')]},{label:'你在这里做什么？',then:[L('等鱼游过来呀。站到桥上看得更清楚，你去试试！')]}]}]);else await say([L(['看到鱼了吗？','老林爷爷的稻田最大，从这里一直到山脚。','明天还来这里吗？'][Math.floor(Math.random()*3)])])}
  else if(n.id==='lin')await say(first?['田埂上的老人直起腰，用草帽扇了扇风。',L('后生，走田埂要看着脚下。'),L(RICE_TALK[STAGE])]:[L(RICE_TALK[STAGE])]);
  else if(n.id==='ayi')await say(first?[L('小伙子，新来的吧？'),L('渴了就来店里，汽水在井水里冰着呢。')]:[L('鸡别追，它们认生。')]);
  else await say(first?[L('你也是出来走走的？'),L('我从海边过来的。这里的风，闻起来是绿色的。')]:[L('听说山顶能看到整个村子。')]);
  n.talking=false;n.wait=1.5}
const VIEW={open:false};
function openView(){VIEW.open=true;KEYS.clear();TARGET=null;$('#view').classList.add('on')}
function closeView(){VIEW.open=false;$('#view').classList.remove('on')}
$('#view').addEventListener('click',closeView);

$('#vimg').style.backgroundImage=`url(${A.shiqiao})`;
let last=performance.now(),TT=0;
function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;TT+=dt;update(dt,TT);render(TT);requestAnimationFrame(frame)}
setTimeout(async()=>{try{await loadChars();buildAll();resize();setStage(1);const vw=innerWidth/S,vh=innerHeight/S;CAM.x=clamp(HERO.x-vw/2,0,WW-vw);CAM.y=clamp(HERO.y-18-vh/2,0,WH-vh);$('#load').hidden=true;requestAnimationFrame(frame)}catch(e){$('#load').textContent='画村子时出错了：'+e.message;throw e}},30);
window.__dbg={HERO,NPCS,CAM,setStage,openView,talk};
