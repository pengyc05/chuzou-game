<title>乡野村试走</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-window 3D view; UI = C "country boards": a hanging wooden sign, cream boards with thick brown rims, wooden buttons. Single look, it sits over the scene. */
:root{
  --cream:#fff7e6; --glass:rgba(255,247,230,.88); --ink:#4a3523; --ink-soft:#7a5d40; --rim:#5e4027;
  --seal:#b23a2e; --leaf:#8fbf6a; --leaf-dk:#5e7d44; --coin:#e8b84a; --heart:#e48b6a; --snow:#fbf8f1; --night:#0a0e14;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif; --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:var(--f-sans);color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
.sh{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.35)}
.glass{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(20,14,8,.2)}
.board{background:var(--cream);border:3px solid var(--rim);box-shadow:0 5px 0 rgba(60,38,20,.3)}
.wood{background-color:#9a6b43;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,transparent 2px,transparent 9px),linear-gradient(180deg,#a8774c,#86592f);border:3px solid var(--rim);color:#fff4dd}
button{font-family:var(--f-sans);cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}

#place{position:fixed;left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));top:env(safe-area-inset-top,0px);display:flex;align-items:flex-start;gap:16px}
#place .hang{display:flex;flex-direction:column;align-items:center}
#place .ropes{display:flex;gap:112px}#place .ropes i{display:block;width:3px;height:24px;background:var(--rim)}
#place .sign{padding:9px 24px 11px;border-radius:10px;box-shadow:0 6px 0 rgba(60,38,20,.35);font-family:var(--f-serif);font-weight:600;font-size:34px;letter-spacing:6px;text-shadow:0 2px 0 var(--rim)}
#dial{margin-top:20px;width:88px;height:88px;border-radius:50%;padding:0;display:block}
#dial svg{display:block;margin:-3px}
#when{margin-top:32px;display:flex;flex-direction:column;gap:2px;background:none;border:none;padding:0;text-align:left;color:#fff7e6;text-shadow:0 2px 4px rgba(40,25,10,.7)}
#when b{font-family:var(--f-serif);font-size:22px;font-weight:600}
#when small{font-size:13px}
#chips{position:fixed;right:max(28px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(24px + env(safe-area-inset-top,0px));display:flex;gap:10px}
.chip{height:48px;border-radius:24px;display:flex;align-items:center;gap:10px;box-sizing:border-box;color:var(--ink)}
.chip .coin{width:30px;height:30px;border-radius:50%;background:var(--coin);border:2px solid #9a6b2a;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#7a4e14}
.chip .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chip .bar{width:96px;height:14px;border-radius:7px;background:#eadcc2;border:2px solid var(--rim);box-sizing:border-box;overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--leaf)}
.chip small{font-size:13px;color:var(--ink-soft)}
#tools{position:fixed;right:max(28px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(92px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
#tools button{width:56px;height:56px;border-radius:16px;box-shadow:0 4px 0 rgba(60,38,20,.35);display:flex;align-items:center;justify-content:center;padding:0}
#tools button[aria-pressed="true"]{filter:saturate(.3) brightness(.85)}
#help{position:fixed;left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 14px;border-radius:14px;pointer-events:none;max-width:calc(100% - 140px);line-height:1.7;transition:opacity 1.2s;color:var(--ink)}
#help kbd{font-family:var(--f-sans);font-size:12px;background:var(--rim);color:var(--cream);border-radius:5px;padding:0 6px;margin:0 2px}

#prompt{position:fixed;left:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity .18s;transform:translate(-50%,-100%)}
#prompt .b{padding:7px 15px 7px 7px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;white-space:nowrap}
#prompt kbd{width:26px;height:26px;border-radius:8px;background:var(--rim);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--f-sans)}
#prompt .tip{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid var(--rim)}

#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(940px,calc(100% - 140px));height:168px;display:none}
#dlg .box{position:absolute;inset:18px 0 0 0;border-radius:26px}
#dlg .tag{position:absolute;left:150px;top:0;padding:5px 20px 6px;border-radius:12px;font-family:var(--f-serif);font-size:20px;letter-spacing:4px}
#dlg .face{position:absolute;left:18px;bottom:16px;width:116px;height:116px;border-radius:50%;border:4px solid var(--rim);box-shadow:0 0 0 4px var(--cream);background:var(--cream) center/cover no-repeat}
#dlg .txt{position:absolute;left:160px;right:30px;top:52px;font-size:20px;line-height:1.65;font-weight:500;color:var(--ink)}
#dlg.mono .tag,#dlg.mono .face{display:none}
#dlg.mono .txt{left:40px;right:40px;top:50px;font-family:var(--f-serif);font-weight:400;color:var(--ink-soft)}
#dlg .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink-soft);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

#card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
#card .ropes{display:flex;gap:180px}#card .ropes i{display:block;width:4px;height:40px;background:var(--rim)}
#card h2{margin:0;padding:14px 40px 16px;border-radius:14px;font-family:var(--f-serif);font-weight:600;font-size:clamp(34px,5vw,52px);letter-spacing:.3em;text-shadow:0 3px 0 var(--rim);box-shadow:0 8px 0 rgba(60,38,20,.35)}
#card p{margin:16px 0 0;padding:6px 18px;border-radius:16px;font-size:16px;font-weight:500}
#title{position:fixed;inset:0;background:var(--night) center/cover no-repeat;display:flex;align-items:center;padding:0 max(24px,8vw);box-sizing:border-box}
#title .in{position:relative;display:flex;flex-direction:column;align-items:flex-start}
#title .ropes{display:flex;gap:150px;margin-left:46px}#title .ropes i{display:block;width:4px;height:34px;background:var(--rim)}
#title h1{margin:0;padding:14px 44px 18px;border-radius:16px;font-family:var(--f-serif);font-weight:600;font-size:clamp(56px,8vw,92px);letter-spacing:.25em;line-height:1;text-shadow:0 4px 0 var(--rim);box-shadow:0 8px 0 rgba(60,38,20,.35)}
#title .panel{margin-top:22px;padding:22px 26px 24px;border-radius:24px;display:flex;flex-direction:column;gap:14px;max-width:26em}
#title .sub{font-family:var(--f-serif);font-size:20px;font-weight:600;letter-spacing:.15em}
#title p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-soft)}
#go{height:52px;padding:0 34px;border-radius:26px;background:var(--leaf);color:#2f3a1f;font-size:18px;font-weight:700;border:3px solid var(--rim);box-shadow:0 4px 0 var(--leaf-dk);align-self:flex-start}
#go:disabled{background:#e4ddcc;box-shadow:0 4px 0 #a99e8a;color:#7a7060;cursor:default}
#load{font-size:13px;color:var(--ink-soft)}
#err{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 16px;font-size:15px;display:none;border-radius:14px}
@media (max-width:760px){#dlg{width:calc(100% - 32px);height:190px}#dlg .txt{left:24px;right:24px;top:62px;font-size:17px}#dlg .face{width:56px;height:56px;left:16px;top:0;bottom:auto}#dlg .tag{left:84px}#chips{flex-direction:column;align-items:flex-end}#dial,#when{display:none}#tools{top:auto;bottom:calc(220px + env(safe-area-inset-bottom,0px))}#help{display:none}#place .sign{font-size:26px}}
@media (prefers-reduced-motion:reduce){#card{transition:none}#dlg .next{animation:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
/*ASSETS*/
const $=s=>document.querySelector(s);
function fail(m){const e=$('#err');e.style.display='block';e.textContent=m}
if(!window.THREE){fail('3D 引擎没有加载成功，请刷新页面再试一次。')}
window.addEventListener('error',e=>{if(!window.__quietErr)fail('出错了：'+e.message)});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
function rng(seed){let a=seed>>>0||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R0=rng(42);
$('#title').style.backgroundImage=`url(${ASSETS.concept})`;
try{if(0){const pc=document.createElement('canvas');pc.width=pc.height=300;const x=pc.getContext('2d');const im=x.createImageData(300,300);const r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=226+r()*29;im.data[i]=v;im.data[i+1]=v-4;im.data[i+2]=v-13;im.data[i+3]=255}x.putImageData(im,0,0);}}catch(e){}

/* ================= world geometry helpers ================= */
const STREAM=[[-170,44],[-120,34],[-90,28],[-50,22],[-20,18],[0,15],[25,10],[50,4],[90,-6],[130,-14],[170,-20]];
const SPTS=(()=>{const out=[];for(let i=0;i<STREAM.length-1;i++){const p0=STREAM[Math.max(0,i-1)],p1=STREAM[i],p2=STREAM[i+1],p3=STREAM[Math.min(STREAM.length-1,i+2)];for(let k=0;k<20;k++){const t=k/20,t2=t*t,t3=t2*t;const f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])])}}out.push(STREAM[STREAM.length-1]);return out})();
function segDist(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az;const t=clamp(((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz||1),0,1);const dx=px-(ax+vx*t),dz=pz-(az+vz*t);return Math.sqrt(dx*dx+dz*dz)}
function polyDist(px,pz,P){let d=1e9;for(let i=0;i<P.length-1;i++){const s=segDist(px,pz,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);if(s<d)d=s}return d}
function streamDist(x,z){return polyDist(x,z,SPTS)}
function streamZ(x){for(let i=0;i<SPTS.length-1;i++){const a=SPTS[i],b=SPTS[i+1];if(x>=a[0]&&x<=b[0]){return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]))}}return 0}
const WATER_Y=-0.55;
function baseH(x,z){
  const ax=Math.abs(x);
  let h=sm(-38,-112,z)*28+sm(50,125,ax)*20+sm(56,120,z)*9;
  const n=Math.sin(x*.045)*Math.cos(z*.05)*1.3+Math.sin(x*.11+1.3)*Math.sin(z*.09+.4)*.55+Math.sin(x*.023-z*.031)*1.6;
  h+=n*(.18+.82*clamp(h/10,0,1));
  return h}
function H(x,z){const d=streamDist(x,z);return baseH(x,z)-1.35*(1-sm(1.6,5.6,d))}
/* paths */
const P_MAIN=[[0,78],[0,66],[.4,52],[-.3,36],[0,22],[0,20.5]];
const P_VILLAGE=[[0,9.5],[0,8],[.6,0],[1,-12]];
const P_SCHOOL=[[1,-12],[-8,-17],[-17,-22],[-24,-26]];
const P_HILL=[[1,-12],[9,-16],[16,-20],[21,-30],[24,-42],[25,-52],[26,-62],[28,-72],[28,-78]];
const P_EAST=[[1,-12],[8,-6],[18,-4],[30,-2]];
const P_WEST=[[.6,0],[-8,-2],[-20,-1],[-32,1]];
const ALLPATHS=[P_MAIN,P_VILLAGE,P_SCHOOL,P_HILL,P_EAST,P_WEST];
function pathDist(x,z){let d=1e9;for(const p of ALLPATHS){const s=polyDist(x,z,p);if(s<d)d=s}return d}
/* bridge: spans world z 20.5 -> 9.5 at x=0 */
const BR={x:0,z0:9.5,z1:20.5,hw:1.3,y:.05};
function onBridge(x,z){return Math.abs(x-BR.x)<BR.hw+.1&&z>BR.z0-.2&&z<BR.z1+.2}
function bridgeY(z){const t=clamp((z-BR.z0)/(BR.z1-BR.z0),0,1);return BR.y+(1-t)*(1-t)*.15+2*t*(1-t)*2.6+t*t*.15}
/* houses */
const HOUSES=[
 {x:-10,z:-6,r:.1,w:7,d:5,h:3.2,k:'white'},{x:-18,z:-14,r:.3,w:6,d:5,h:3,k:'wood'},{x:12,z:-3,r:-.2,w:7,d:5,h:3.4,k:'white'},
 {x:21,z:-13,r:-.4,w:6,d:5,h:3,k:'white'},{x:-2,z:-28,r:0,w:8,d:5,h:3.4,k:'white'},{x:10,z:-27,r:-.1,w:6,d:5,h:3,k:'wood'},
 {x:-31,z:-6,r:.5,w:6,d:5,h:3,k:'earth'},{x:33,z:-9,r:-.6,w:6,d:5,h:3,k:'wood'}];
const SCHOOL={x:-26,z:-37,w:16,d:6,h:3.6};
const PLAY={x:-26,z:-28.5,w:17,d:10};
function blocked(x,z){
  if(onBridge(x,z))return false;
  if(streamDist(x,z)<2.5)return true;
  for(const b of HOUSES){const c=Math.cos(-b.r),s=Math.sin(-b.r);const lx=(x-b.x)*c-(z-b.z)*s,lz=(x-b.x)*s+(z-b.z)*c;if(Math.abs(lx)<b.w/2+.45&&Math.abs(lz)<b.d/2+.45)return true}
  if(Math.abs(x-SCHOOL.x)<SCHOOL.w/2+.45&&Math.abs(z-SCHOOL.z)<SCHOOL.d/2+.45)return true;
  if(Math.hypot(x-7,z-15.5)<.9)return true;
  if(Math.hypot(x,z+6)>150)return true;
  return false}
function camHit(x,y,z){for(const b of HOUSES){const c=Math.cos(b.r),s=Math.sin(b.r);const dx=x-b.x,dz=z-b.z;const lx=dx*c+dz*s,lz=-dx*s+dz*c;if(Math.abs(lx)<b.w/2+.9&&Math.abs(lz)<b.d/2+.9&&y<(b.y0||0)+b.h+b.d*.42+1)return true}if(Math.abs(x-SCHOOL.x)<SCHOOL.w/2+.9&&Math.abs(z-SCHOOL.z)<SCHOOL.d/2+.9&&y<H(SCHOOL.x,SCHOOL.z)+SCHOOL.h+3)return true;return false}
function groundY(x,z){return onBridge(x,z)?Math.max(H(x,z),bridgeY(z)):H(x,z)}

/* ================= painted textures (canvas) ================= */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}

function ribbon(P,width,yOff,step=1,yfn){const pts=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.max(1,Math.ceil(L/step));for(let k=0;k<n;k++){const t=k/n;pts.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t)])}}pts.push(P[P.length-1]);
  const pos=[],uv=[],idx=[];let acc=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[Math.min(pts.length-1,i+1)],o=pts[Math.max(0,i-1)];let dx=q[0]-o[0],dz=q[1]-o[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const nx=-dz,nz=dx;if(i>0)acc+=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]);
    for(const s of[-1,1]){const x=p[0]+nx*width/2*s,z=p[1]+nz*width/2*s;const y=yfn?yfn(x,z):H(x,z)+yOff;pos.push(x,y,z);uv.push(s<0?0:1,acc/width)}
    if(i<pts.length-1){const j=i*2;idx.push(j,j+1,j+2,j+1,j+3,j+2)}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g}
