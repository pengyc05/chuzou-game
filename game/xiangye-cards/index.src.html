<title>乡野村 · 卡牌版</title>

<style>
/* Layout: full-window animated scene; option C "country boards" UI on top: hanging sign + season dial top-left, coin/stamina top-right, a hand of location cards along the bottom, dialogue board above the hand. Single look that sits over the painting. */
:root{
  --cream:#fff7e6; --rim:#5e4027; --ink:#4a3523; --ink-soft:#7a5d40; --leaf:#8fbf6a; --leaf-dk:#5e7d44; --coin:#e8b84a; --night:#14110e;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif; --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:var(--f-sans);color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{display:block}
#scene,#fx,#prev{position:fixed;inset:0;width:100%;height:100%}
#prev{pointer-events:none;opacity:0;transition:opacity 1.1s ease,filter 1.1s ease}
#fx{pointer-events:none}
#lu{position:fixed;right:max(4vw,calc(env(safe-area-inset-right,0px) + 12px));bottom:-14vh;height:86vh;aspect-ratio:2/3;max-width:56vw;opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s ease;cursor:pointer}
#lu.on{opacity:1;transform:none}
#lu canvas{width:100%;height:100%}
.board{background:var(--cream);border:3px solid var(--rim);box-shadow:0 5px 0 rgba(60,38,20,.3)}
.glass{background:rgba(255,247,230,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wood{background-color:#9a6b43;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,transparent 2px,transparent 9px),linear-gradient(180deg,#a8774c,#86592f);border:3px solid var(--rim);color:#fff4dd}
button{font-family:var(--f-sans);cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}

#place{position:fixed;left:max(24px,calc(env(safe-area-inset-left,0px) + 16px));top:env(safe-area-inset-top,0px);display:flex;align-items:flex-start;gap:16px;z-index:5}
.hang{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.hang.swing{animation:swing 1.4s ease-out}
@keyframes swing{0%{transform:rotate(7deg)}30%{transform:rotate(-5deg)}55%{transform:rotate(3deg)}80%{transform:rotate(-1deg)}100%{transform:none}}
.ropes{display:flex;justify-content:space-around;width:70%}.ropes i{display:block;width:3px;height:22px;background:var(--rim)}
.sign{padding:6px 22px 10px;border-radius:10px;box-shadow:0 6px 0 rgba(60,38,20,.35);text-align:center;min-width:120px}
.sign small{display:block;font-size:12px;letter-spacing:4px;opacity:.85}
.sign b{display:block;font-family:var(--f-serif);font-weight:600;font-size:30px;letter-spacing:5px;text-shadow:0 2px 0 var(--rim);white-space:nowrap}
#dial{margin-top:20px;width:80px;height:80px;border-radius:50%;padding:0}
#dial svg{display:block;margin:-3px}
#when{margin-top:30px;display:flex;flex-direction:column;gap:2px;background:none;border:none;padding:0;text-align:left;color:#fff7e6;text-shadow:0 2px 4px rgba(40,25,10,.75)}
#when b{font-family:var(--f-serif);font-size:21px;font-weight:600}
#when small{font-size:13px}
#chips{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(22px + env(safe-area-inset-top,0px));display:flex;gap:10px;z-index:5}
.chip{height:46px;border-radius:23px;display:flex;align-items:center;gap:10px;box-sizing:border-box;color:var(--ink)}
.coin{width:30px;height:30px;border-radius:50%;background:var(--coin);border:2px solid #9a6b2a;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#7a4e14}
.chip .num{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.chip .bar{width:90px;height:14px;border-radius:7px;background:#eadcc2;border:2px solid var(--rim);box-sizing:border-box;overflow:hidden}.chip .bar i{display:block;height:100%;background:var(--leaf)}
.chip small{font-size:13px;color:var(--ink-soft)}
#tools{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;z-index:5}
#tools button{width:54px;height:54px;border-radius:16px;box-shadow:0 4px 0 rgba(60,38,20,.35);display:flex;align-items:center;justify-content:center;padding:0}
#tools button[aria-pressed="true"]{filter:saturate(.3) brightness(.85)}

#hand{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6;transition:transform .5s ease,opacity .5s ease}
#hand.down{transform:translateY(120%);opacity:0;pointer-events:none}
.card{position:relative;flex:none;width:118px;height:166px;margin:0 -6px;padding:0;border-radius:14px;border:3px solid var(--rim);background:var(--cream);box-shadow:0 5px 0 rgba(60,38,20,.35),0 10px 24px rgba(20,12,6,.3);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease;text-align:left;color:var(--ink)}
.card img{display:block;width:100%;height:84px;object-fit:cover;border-bottom:2px solid var(--rim)}
.card b{font-family:var(--f-serif);font-size:16px;font-weight:600;margin:7px 9px 2px;letter-spacing:1px}
.card span{font-size:11.5px;line-height:1.45;margin:0 9px;color:var(--ink-soft)}
.card:hover,.card:focus-visible{transform:translateY(-14px) rotate(0deg)!important;z-index:2}
.card.here{transform:translateY(-22px)!important;z-index:3;border-color:var(--leaf-dk);box-shadow:0 5px 0 var(--leaf-dk),0 12px 28px rgba(20,12,6,.35)}
.card.here::after{content:"你在这里";position:absolute;top:6px;left:6px;padding:1px 8px;border-radius:9px;background:var(--leaf);border:2px solid var(--rim);font-size:11px;font-weight:700;color:#2f3a1f}
.card .who{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--rim);background:var(--cream) center/cover no-repeat}

#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(920px,calc(100% - 32px));min-height:166px;display:none;z-index:7}
#dlg .box{position:absolute;inset:18px 0 0 0;border-radius:26px}
#dlg .tag{position:absolute;left:150px;top:0;padding:5px 20px 6px;border-radius:12px;font-family:var(--f-serif);font-size:20px;letter-spacing:4px}
#dlg .face{position:absolute;left:18px;bottom:16px;width:116px;height:116px;border-radius:50%;border:4px solid var(--rim);box-shadow:0 0 0 4px var(--cream);background:var(--cream) 50% 30%/170% no-repeat}
#dlg .txt{position:relative;margin:52px 30px 26px 160px;font-size:19px;line-height:1.7;font-weight:500;color:var(--ink);min-height:64px}
#dlg.mono .tag,#dlg.mono .face{display:none}
#dlg.mono .txt{margin-left:40px;font-family:var(--f-serif);font-weight:400;color:var(--ink-soft)}
#dlg .opts{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin:-10px 26px 22px 160px}
#dlg.mono .opts{margin-left:40px}
#dlg .opts button{height:44px;padding:0 20px;border-radius:22px;border:3px solid var(--rim);background:#fff;color:var(--ink);font-size:15px;font-weight:500;box-shadow:0 4px 0 rgba(60,38,20,.3)}
#dlg .opts button:first-child{background:var(--leaf);color:#2f3a1f;font-weight:700;box-shadow:0 4px 0 var(--leaf-dk)}
#dlg .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink-soft);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

#talkTip{position:fixed;z-index:6;padding:7px 15px 7px 7px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;transform:translate(-50%,-100%);cursor:pointer}
#talkTip kbd{width:24px;height:24px;border-radius:8px;background:var(--rim);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--f-sans)}
#arrive{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);padding:12px 34px 14px;border-radius:14px;font-family:var(--f-serif);font-size:30px;letter-spacing:8px;opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:8;text-shadow:0 2px 0 var(--rim);box-shadow:0 7px 0 rgba(60,38,20,.35)}
#arrive small{display:block;font-family:var(--f-sans);font-size:13px;letter-spacing:3px;text-align:center;margin-top:2px;opacity:.85;text-shadow:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(196px + env(safe-area-inset-bottom,0px));padding:6px 16px;border-radius:16px;font-size:14px;z-index:5;transition:opacity 1s}

#title{position:fixed;inset:0;z-index:10;background:var(--night) center/cover no-repeat;display:flex;align-items:center;padding:0 max(24px,8vw);box-sizing:border-box}
#title .in{display:flex;flex-direction:column;align-items:flex-start}
#title .ropes{width:auto;gap:150px;margin-left:46px;justify-content:flex-start}#title .ropes i{height:34px;width:4px}
#title h1{margin:0;padding:14px 44px 18px;border-radius:16px;font-family:var(--f-serif);font-weight:600;font-size:clamp(56px,8vw,92px);letter-spacing:.25em;line-height:1;text-shadow:0 4px 0 var(--rim);box-shadow:0 8px 0 rgba(60,38,20,.35)}
#title .panel{margin-top:22px;padding:22px 26px 24px;border-radius:24px;display:flex;flex-direction:column;gap:14px;max-width:26em}
#title .sub{font-family:var(--f-serif);font-size:20px;font-weight:600;letter-spacing:.15em}
#title p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-soft)}
#go{height:52px;padding:0 34px;border-radius:26px;background:var(--leaf);color:#2f3a1f;font-size:18px;font-weight:700;border:3px solid var(--rim);box-shadow:0 4px 0 var(--leaf-dk);align-self:flex-start}
#go:disabled{background:#e4ddcc;box-shadow:0 4px 0 #a99e8a;color:#7a7060;cursor:default}
#load{font-size:13px;color:var(--ink-soft)}
#err{position:fixed;left:16px;right:16px;top:16px;padding:12px 16px;border-radius:14px;z-index:20}
@media (max-width:820px){.card{width:92px;height:136px;margin:0 -10px}.card img{height:62px}.card span{display:none}#dial,#when{display:none}.sign b{font-size:22px}#hint{bottom:calc(160px + env(safe-area-inset-bottom,0px))}#dlg .txt,#dlg .opts{margin-left:24px}#dlg .face{width:56px;height:56px;top:0;bottom:auto}#dlg .tag{left:84px}#chips{top:calc(118px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:auto}.chip{height:38px}.chip .num{font-size:17px}.chip .bar{width:60px}#tools{top:calc(20px + env(safe-area-inset-top,0px))}#tools button{width:46px;height:46px}#dlg .txt{margin-top:58px}}
@media (prefers-reduced-motion:reduce){#prev,#lu,#hand{transition:none}.hang.swing{animation:none}#dlg .next{animation:none}}
</style>

<script>
'use strict';
/*ASSETS*/
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fail(m){const e=$('#err');e.hidden=false;e.textContent=m}
const IMG_AR=1024/572;

/* ---------------- scenes ---------------- */
const SC=[
 {key:'cunkou',name:'村口',desc:'老樟树下的木牌，进村和离开都在这里',fx:'pollen',rays:.5,shadow:0,fog:[0,0,0],rects:[]},
 {key:'tiangeng',name:'田埂',desc:'水田映着天，油菜花开成一片',fx:'pollen',rays:0,shadow:.12,fog:[0,0,0],rects:[[670,330,725,450,4,.0025]]},
 {key:'shiqiao',name:'石桥小溪',desc:'长着青苔的拱桥，溪边有洗衣石',fx:'petal',rays:0,shadow:0,fog:[0,0,0],rects:[],npc:true},
 {key:'dahe',name:'大河',desc:'渡口拴着竹筏和小木船，河上有晨雾',fx:'birds',rays:0,shadow:0,fog:[.36,.52,.55],rects:[[700,420,866,498,1,.0028],[512,300,708,362,1,.0016]]},
 {key:'xuexiao',name:'村小学',desc:'一排平房教室，操场边的樱花开了',fx:'petal',rays:0,shadow:.08,fog:[0,0,0],rects:[[556,146,584,206,2,.0035]]},
 {key:'laojie',name:'老街小卖部',desc:'青石板路，晒着被单的杂货铺',fx:'dapple',rays:0,shadow:0,fog:[0,0,0],rects:[[322,262,472,338,3,.004],[480,252,614,302,3,.004],[212,318,244,366,4,.004],[452,296,484,348,4,.004],[496,328,524,380,4,.004],[604,252,632,304,4,.004]]},
 {key:'zhulin',name:'山林竹林',desc:'穿过竹林往山上去的石阶',fx:'leaf',rays:1,shadow:0,fog:[.25,.5,.35],rects:[]},
 {key:'laomiao',name:'村尾老庙',desc:'村子尽头的小土地庙和老树',fx:'smoke',rays:.25,shadow:0,fog:[0,0,0],rects:[[756,56,904,336,3,.003]],smoke:[509,470]},
 {key:'shanding',name:'山顶',desc:'整个乡野村都在脚下',fx:'birds',rays:0,shadow:.16,fog:[.36,.6,.45],rects:[]}];
const TOD=['上午','中午','傍晚','夜晚'];
const ST={scene:0,tod:0,todF:0,metLu:false,busy:false};

/* ---------------- scene renderer ---------------- */
const cv=$('#scene');const gl=cv.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:false});
if(!gl)fail('这台电脑的浏览器没有开启 WebGL，画面无法显示。');
const VS=`attribute vec2 p;varying vec2 vUv;void main(){vUv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;varying vec2 vUv;uniform sampler2D img,msk;uniform float time,tod,rays,shadow;uniform vec3 fog;uniform vec2 sc,off,mouse;uniform vec4 uR[6];uniform vec2 uT[6];
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.03;a*=.5;}return v;}
vec3 grade(vec3 c,vec3 m,vec2 uv,float k){
 if(k<.5)return c;
 if(k<1.5){return mix(vec3(dot(c,vec3(.3,.59,.11))),c,1.08)*1.04;}
 if(k<2.5){vec3 w=c*vec3(1.12,.84,.64)+vec3(.06,.015,0.);vec3 sky=mix(vec3(1.,.66,.46),vec3(.58,.44,.72),clamp(1.-uv.y*2.6,0.,1.));return mix(w,sky*(.75+.35*dot(c,vec3(.33))),m.b*.62);}
 vec3 n=c*vec3(.26,.32,.52)+vec3(0.,.008,.03);vec3 sky=mix(vec3(.10,.14,.28),vec3(.02,.04,.12),clamp(1.-uv.y*2.4,0.,1.));n=mix(n,sky+c*.08,m.b*.85);
 float st=step(.9965,hash(floor(uv*vec2(700.,390.))))*m.b*(.6+.4*sin(time*2.+hash(floor(uv*vec2(700.,390.)))*40.));n+=st;
 float moon=smoothstep(.06,.0,length((uv-vec2(.8,.12))*vec2(1.79,1.)));n+=vec3(.9,.92,.8)*moon*m.b*.6+vec3(.12,.14,.2)*smoothstep(.35,.0,length((uv-vec2(.8,.12))*vec2(1.79,1.)))*m.b;
 return n;}
void main(){vec2 uv=(vUv-.5)*sc+.5+off;float depth=smoothstep(.2,1.,uv.y);uv+=mouse*(.003+.009*depth);
 vec3 m=texture2D(msk,uv).rgb;vec2 d=vec2(0.);
 d.x+=sin(time*.035)*.012*m.b+sin(time*.11)*.002*m.b;
 float gust=.55+.45*sin(time*.37+uv.x*2.);

  ST.todF+=(ST.tod-ST.todF)*(1-Math.pow(.15,dt));if(ST.tod===0&&ST.todF>2.9)ST.todF=0;
  OFF=[Math.sin(T*.021)*.012,Math.cos(T*.017)*.008];
  if(snapPending){const pv=$('#prev');const c=pv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.drawImage(cv,0,0,pv.width,pv.height);c.drawImage($('#fx'),0,0,pv.width,pv.height);snapPending=false}
  gl.uniform1f(U.time,T);gl.uniform1f(U.tod,ST.todF);gl.uniform2f(U.off,OFF[0],OFF[1]);gl.uniform2f(U.mouse,-MOUSE.x,-MOUSE.y*.6);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  if(snapPending===false&&window.__snapNow){window.__snapNow=false}
  fxStep(dt);
  if(LU&&SC[ST.scene].npc){LU.draw(dt,MOUSE.x,MOUSE.y);const lu=$('#lu').getBoundingClientRect();const tip=$('#talkTip');tip.style.left=(lu.left+lu.width*.55)+'px';tip.style.top=(lu.top+lu.height*.06)+'px';
    const tint=[[1,1,1],[1.03,1.03,1.03],[1.05,.88,.74],[.45,.5,.68]][ST.tod];$('#luc').style.filter=`brightness(${(tint[0]+tint[1]+tint[2])/3}) sepia(${ST.tod===2?.25:0}) hue-rotate(${ST.tod===3?-12:0}deg) saturate(${ST.tod===3?.75:1})`}
  requestAnimationFrame(frame)}

Promise.all(SC.map(async s=>({img:await loadTex(A['img_'+s.key]),msk:await loadTex(A['msk_'+s.key])}))).then(async t=>{TEX.push(...t);LU&&await LU.ready;resize();setScene(0);fxReset();renderHand();requestAnimationFrame(frame);
  $('#go').disabled=false;$('#load').textContent='准备好了'}).catch(e=>fail('素材没有加载成功，请刷新页面再试一次。'));

  $('#arriveT').textContent=SC[0].name;$('#arriveS').textContent='乡野村 · 上午';$('#arrive').style.opacity=1;setTimeout(()=>$('#arrive').style.opacity=0,1800);setTimeout(()=>{$('#hint').style.opacity=0},12000)};
window.__dbg={ST,travel,advanceTime,SC,talkLu};
