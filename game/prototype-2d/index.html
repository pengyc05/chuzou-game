<title>出走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one fixed 1280x720 stage, scaled to fit the window, letterboxed on ink. UI is paper notes laid over a hand-drawn world. */
:root{
  --ink:#3a2e28; --ink-soft:#6b5a4f; --paper:#f4ecdc; --paper-2:#e9dcc4;
  --accent:#c9764f; --sea:#4f93a6; --good:#5f8f5a; --bad:#b4513f; --letterbox:#1c1714;
  --f-hand:"Long Cang","Ma Shan Zheng","KaiTi","STKaiti",cursive;
  --f-body:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--letterbox);overflow:hidden}
body{color:var(--ink);font-family:var(--f-body);user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#222}
#cv{position:absolute;inset:0;width:1280px;height:720px;transition:filter 1.2s ease}
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,25,15,.38) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:var(--letterbox);opacity:1;pointer-events:none;transition:opacity .9s ease}
.note{background:var(--paper);border:2px solid var(--ink);border-radius:3px 6px 4px 7px/6px 3px 7px 4px;box-shadow:3px 4px 0 rgba(30,20,15,.28)}
button{font-family:var(--f-body);font-size:17px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:4px 7px 5px 6px/7px 4px 6px 5px;padding:6px 14px;cursor:pointer;box-shadow:2px 3px 0 rgba(30,20,15,.3)}
button:hover{background:#fff6e4;transform:translate(-1px,-1px);box-shadow:3px 4px 0 rgba(30,20,15,.3)}
button:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
button[disabled]{opacity:.45;cursor:default;transform:none}

/* HUD */
#hud{position:absolute;left:0;top:0;right:0;display:flex;justify-content:space-between;padding:16px 18px;pointer-events:none}
#hud .left{display:flex;gap:10px;align-items:flex-start}
.tag{padding:6px 12px 7px;font-size:18px;transform:rotate(-1.2deg)}
.tag b{font-family:var(--f-hand);font-weight:400;font-size:24px;margin-right:6px}
#coins{transform:rotate(1deg);font-variant-numeric:tabular-nums}
#fat{transform:rotate(-.6deg);display:flex;gap:8px;align-items:center}
#fat i{display:block;width:90px;height:10px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff8}
#fat i s{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
#hud .right{display:flex;gap:10px;pointer-events:auto}
.hbtn{position:relative;font-size:16px;padding:6px 12px}
.hbtn kbd{font-family:var(--f-body);font-size:12px;opacity:.6;margin-left:4px}
.badge{position:absolute;right:-8px;top:-8px;background:var(--bad);color:#fff;border-radius:10px;font-size:12px;min-width:18px;height:18px;line-height:18px;text-align:center;border:1.5px solid var(--ink)}
#prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:6px 16px;font-size:18px;pointer-events:none;opacity:0;transition:opacity .2s}
#prompt kbd{display:inline-block;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;margin-right:8px;font-family:var(--f-body);background:#fff}
#help{position:absolute;left:18px;bottom:14px;font-size:14px;color:#f4ecdcd0;text-shadow:0 1px 2px #0008;pointer-events:none;transition:opacity 1s}
#toast{position:absolute;right:18px;top:72px;width:280px;padding:10px 14px;font-size:16px;transform:translateX(330px);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#toast.on{transform:translateX(0) rotate(.8deg)}
#toast small{display:block;font-size:13px;color:var(--ink-soft)}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.2s;color:var(--paper);text-shadow:0 2px 12px #000a}
#card h2{font-family:var(--f-hand);font-weight:400;font-size:64px;margin:0}
#card p{font-size:22px;margin:8px 0 0;letter-spacing:.2em}

/* Dialog */
#dlg{position:absolute;left:150px;right:150px;bottom:22px;min-height:118px;padding:16px 22px 16px 132px;display:none}
#dlg.mono{padding-left:28px;background:rgba(244,236,220,.92)}
#dlg.mono #dtext{font-style:italic;color:var(--ink-soft)}
#dport{position:absolute;left:14px;top:-34px;width:104px;height:104px;border:2px solid var(--ink);border-radius:50% 46% 52% 48%/48% 52% 46% 50%;background:var(--paper-2);overflow:hidden}
#dlg.mono #dport{display:none}
#dname{position:absolute;left:24px;bottom:12px;font-family:var(--f-hand);font-size:26px;width:90px;text-align:center}
#dlg.mono #dname{display:none}
#dtext{font-size:21px;line-height:1.6;min-height:66px}
#dch{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#dch button{text-align:left}
#dch button span{opacity:.5;margin-right:8px;font-size:14px}
#dnext{position:absolute;right:16px;bottom:10px;font-size:14px;opacity:.5;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(28,20,16,.55);display:none;align-items:center;justify-content:center}
#mbox{position:relative;padding:20px 24px;max-width:1120px}
#mbox h3{font-family:var(--f-hand);font-weight:400;font-size:34px;margin:0 0 6px}
#mbox .sub{font-size:15px;color:var(--ink-soft);margin-bottom:12px}
.mclose{position:absolute;right:12px;top:12px;font-size:14px;padding:3px 10px}

/* Phone */
#phone{position:absolute;right:30px;bottom:24px;width:300px;height:520px;background:#2b2725;border:3px solid var(--ink);border-radius:30px;padding:14px 10px;display:none;box-shadow:5px 6px 0 rgba(0,0,0,.35);transform:rotate(1.5deg)}
#phone .scr{background:#ece6da;border-radius:18px;height:100%;display:flex;flex-direction:column;overflow:hidden}
#phone .top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1.5px solid #0002;font-size:15px}
#phone .top button{font-size:13px;padding:2px 8px}
#plist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:7px 10px;border-radius:10px;font-size:15px;line-height:1.45;background:#fff;border:1.5px solid #0003;align-self:flex-start}
.msg small{display:block;font-size:12px;color:var(--ink-soft)}
.msg.me{align-self:flex-end;background:#cfe6c7}
.preps{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1.5px solid #0002}
.preps button{font-size:14px;padding:4px 8px;text-align:left}
.off{flex:1;display:flex;align-items:center;justify-content:center;color:#8c8478;font-size:16px}

/* Handbook */
.book{width:980px;height:560px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 8px 0 rgba(0,0,0,.3);position:relative}
.book:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:2px dashed #0002}
.page{padding:26px 30px;overflow-y:auto;min-width:0}
.page h4{font-family:var(--f-hand);font-weight:400;font-size:30px;margin:0 0 10px}
.tabs{position:absolute;top:-40px;left:30px;display:flex;gap:6px}
.tabs button{border-bottom:none;border-radius:8px 8px 0 0;font-size:16px;padding:6px 18px;box-shadow:none}
.tabs button.on{background:var(--paper);position:relative;top:2px}
.person{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.person canvas{width:72px;height:72px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper-2);flex:none}
.person b{font-family:var(--f-hand);font-weight:400;font-size:24px}
.person p{margin:2px 0;font-size:15px;line-height:1.5;color:var(--ink-soft)}
.person q{font-family:var(--f-hand);font-size:21px;color:var(--ink)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ph{background:#fff;padding:6px 6px 22px;border:1px solid #0002;box-shadow:2px 3px 0 #0002;position:relative}
.ph:nth-child(odd){transform:rotate(-1.5deg)}.ph:nth-child(even){transform:rotate(1.2deg)}
.ph img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.ph span{position:absolute;left:8px;bottom:3px;font-family:var(--f-hand);font-size:17px}
.empty{color:var(--ink-soft);font-size:16px;line-height:1.7}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed #0003;padding:7px 0;font-size:17px;font-variant-numeric:tabular-nums}

/* Minigames */
.mg{display:flex;flex-direction:column;align-items:center;gap:10px}
.mg canvas{border:2px solid var(--ink);border-radius:4px;background:#d8e4e6;cursor:crosshair}
.mgbar{display:flex;gap:24px;font-size:20px;font-variant-numeric:tabular-nums}
.editor{display:grid;grid-template-columns:380px 520px;gap:22px;width:922px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:400px;overflow-y:auto;padding:4px}
.clip{background:#fff;border:2px solid #0002;padding:3px;cursor:pointer;position:relative}
.clip.sel{border-color:var(--accent)}
.clip img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.clip span{font-size:12px;display:block;padding:2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#2f2a27;padding:10px;border-radius:4px}
.slot{aspect-ratio:16/9;border:2px dashed #fff5;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff8;font-size:14px;cursor:pointer;overflow:hidden;position:relative}
.slot img{width:100%;height:100%;object-fit:cover}
.slot b{position:absolute;left:4px;top:2px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
.preview{aspect-ratio:16/9;background:#111;position:relative;overflow:hidden;border:2px solid var(--ink)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s;animation:kb 4s linear infinite}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.preview .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:22px;text-shadow:0 2px 4px #000}
.preview .cap.hand{font-family:var(--f-hand);font-size:30px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.opts button{font-size:15px;padding:4px 10px}
.opts button.on{background:var(--ink);color:var(--paper)}
.lbl{font-size:14px;color:var(--ink-soft);letter-spacing:.1em}
.poster{width:300px;height:420px;position:relative;overflow:hidden;border:2px solid var(--ink);display:flex;flex-direction:column}
.poster img{width:100%;height:58%;object-fit:cover;display:block}
.poster .ptxt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 16px;text-align:center}
.poster.warm{background:#f6ead4}.poster.warm .ph1{font-family:var(--f-hand);font-size:34px;color:#6a3f2a;line-height:1.15}
.poster.modern{background:#fff}.poster.modern .ph1{font-size:24px;letter-spacing:.08em;color:#1f3c4a}
.poster.red{background:#c4282a}.poster.red .ph1{font-size:30px;color:#ffe25c;font-weight:bold;text-shadow:2px 2px 0 #7a0f10}
.poster .ph2{font-size:13px;margin-top:8px;opacity:.7}
.poster.red .ph2{color:#fff}
.poster.big .ph1{font-size:44px}

/* Title */
#title{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,20,16,.62),rgba(28,20,16,.25) 45%,transparent 70%);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:120px;gap:14px}
#title h1{font-family:var(--f-hand);font-weight:400;font-size:132px;margin:0;color:var(--paper);text-shadow:3px 4px 0 rgba(30,20,15,.45);line-height:1}
#title .tl{font-size:22px;color:var(--paper);letter-spacing:.3em;text-shadow:0 2px 6px #0009;margin-bottom:26px}
#title .tb{display:flex;gap:14px}
#title button{font-size:22px;padding:10px 26px}
#title .ver{position:absolute;right:20px;bottom:16px;color:#f4ecdc99;font-size:13px}
#endc{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,15,12,.6)}
@media (prefers-reduced-motion:reduce){#cv,#fade,#card{transition:none}#dnext{animation:none}}
</style>

<div id="wrap"><div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="paper"></div><div id="vig"></div><div id="flash"></div>
  <div id="hud" hidden>
    <div class="left">
      <div class="tag note" id="where"><b>小镇</b>夜晚</div>
      <div class="tag note" id="coins">¥ 320</div>
      <div class="tag note" id="fat">疲惫 <i><s></s></i></div>
    </div>
    <div class="right">
      <button class="hbtn" id="bPhone">手机<kbd>P</kbd><span class="badge" id="badge" hidden>1</span></button>
      <button class="hbtn" id="bBook">人生手账<kbd>J</kbd></button>
      <button class="hbtn" id="bSnd">声音<kbd>M</kbd></button>
    </div>
  </div>
  <div id="prompt" class="note"><kbd>E</kbd><span></span></div>
  <div id="help">A / D 走路　W / S 前后移动　E 互动</div>
  <div id="toast" class="note"></div>
  <div id="card"><h2></h2><p></p></div>
  <div id="dlg" class="note"><div id="dport"></div><div id="dname"></div><div id="dtext"></div><div id="dch"></div><div id="dnext">E ▸</div></div>
  <div id="phone"><div class="scr"><div class="top"><span id="ptime">20:47</span><button id="pPower">关机</button><button id="pClose">收起</button></div><div id="plist"></div><div class="preps" id="preps"></div></div></div>
  <div id="modal"><div id="mbox"></div></div>
  <div id="title">
    <h1>出走</h1>
    <div class="tl">一百份零工　一百种人生</div>
    <div class="tb"><button id="tNew">开始出走</button><button id="tCont" hidden>继续旅程</button></div>
    <div class="ver">试玩版 · 序章 + 第一章　·　建议用电脑键盘游玩</div>
  </div>
  <div id="fade"></div>
</div></div>

<script>
'use strict';
/* ============ basics ============ */
const W=1280,H=720,K=1.5,INK='#3a2e28';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){let a=seed>>>0||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(c){if(c.startsWith('rgb'))return c.match(/[\d.]+/g).slice(0,3).map(Number);c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);return[n>>16&255,n>>8&255,n&255]}
function rgb(a){return'rgb('+a.map(v=>Math.round(clamp(v,0,255))).join(',')+')'}
function shade(c,t){const a=hex(c);return rgb(a.map(v=>t<0?v*(1+t):v+(255-v)*t))}
function mixc(c1,c2,t){const a=hex(c1),b=hex(c2);return rgb(a.map((v,i)=>lerp(v,b[i],t)))}
function rgba(c,al){const a=hex(c);return`rgba(${a[0]},${a[1]},${a[2]},${al})`}

function fitStage(){const s=Math.min(innerWidth/W,innerHeight/H);const st=$('#stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-W*s)/2)+'px';st.style.top=((innerHeight-H*s)/2)+'px';fitStage.s=s}
addEventListener('resize',fitStage);fitStage();

/* ============ sketch toolkit ============ */
function wob(pts,r,amt,closed){const out=[],n=pts.length,segs=closed?n:n-1;
  for(let i=0;i<segs;i++){const a=pts[i],b=pts[(i+1)%n];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.round(d/26));
    for(let j=0;j<k;j++){const t=j/k;out.push([a[0]+(b[0]-a[0])*t+(r()-.5)*amt,a[1]+(b[1]-a[1])*t+(r()-.5)*amt])}}
  if(!closed){const l=pts[n-1];out.push([l[0]+(r()-.5)*amt,l[1]+(r()-.5)*amt])}return out}
function trace(c,p,closed){c.beginPath();if(p.length<3||!closed){c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);return}
  const n=p.length;let m=[(p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2];c.moveTo(m[0],m[1]);for(let i=0;i<n;i++){const q=p[i],nx=p[(i+1)%n];c.quadraticCurveTo(q[0],q[1],(q[0]+nx[0])/2,(q[1]+nx[1])/2)}c.closePath()}
function Sk(c,fs,ls){const fr=rng(fs),lr=rng(ls);const S={
  poly(pts,fill,o={}){if(fill){const p=wob(pts,fr,o.fw??1.4,true);c.save();trace(c,p,true);c.globalAlpha=o.alpha??1;c.fillStyle=fill;c.fill();
      if(o.wash!==false){c.clip();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of pts){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}
        const w=x1-x0,h=y1-y0,sz=Math.max(w,h);for(let i=0;i<(o.blots??6);i++){const x=x0+fr()*w,y=y0+fr()*h,r=sz*(.15+fr()*.45);const g=c.createRadialGradient(x,y,0,x,y,r);const col=fr()<.55?shade(fill,-.12-fr()*.1):shade(fill,.18);c.globalAlpha=.22;g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
        c.globalAlpha=.28;c.lineWidth=o.edge??6;c.strokeStyle=shade(fill,-.3);trace(c,p,true);c.stroke()}
      c.restore()}
    if(o.line!==false)S.outline(pts,true,o)},
  outline(pts,closed,o={}){const ps=o.passes??2;c.save();c.lineCap='round';c.lineJoin='round';for(let k=0;k<ps;k++){const p=wob(pts,lr,o.lj??2.2,closed);c.strokeStyle=o.ink??INK;c.globalAlpha=(o.la??.85)*(k?.5:1);c.lineWidth=(o.lw??2)*(k?.7:1);trace(c,p,closed);c.stroke()}c.restore()},
  rect(x,y,w,h,fill,o){S.poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill,o)},
  ell(cx,cy,rx,ry,fill,o={}){const n=o.n??Math.max(10,Math.round((rx+ry)/5));const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}S.poly(p,fill,o)},
  line(pts,o){S.outline(pts,false,o)},
  text(t,x,y,size,col,font,al='center'){c.save();c.font=`${size}px ${font||'"Long Cang",cursive'}`;c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(t,x,y);c.restore()},
  r:fr};return S}
let SEED=100;
function sprite(w,h,draw,o={}){const seed=SEED+=13;const f=[];for(let v=0;v<2;v++){const c=document.createElement('canvas');c.width=Math.ceil(w*K);c.height=Math.ceil(h*K);const x=c.getContext('2d');x.scale(K,K);draw(Sk(x,seed,seed*7+v*991),x,w,h);f.push(c)}return{w,h,f,ax:o.ax??w/2,ay:o.ay??h}}

/* paper texture */
(function(){const c=document.createElement('canvas');c.width=c.height=360;const x=c.getContext('2d');const im=x.createImageData(360,360);const r=rng(7);
  for(let i=0;i<im.data.length;i+=4){const v=225+r()*30;im.data[i]=v;im.data[i+1]=v-4;im.data[i+2]=v-14;im.data[i+3]=255}x.putImageData(im,0,0);
  x.globalAlpha=.08;x.strokeStyle='#7a6a55';for(let i=0;i<220;i++){x.beginPath();const a=r()*360,b=r()*360;x.moveTo(a,b);x.quadraticCurveTo(a+r()*20-10,b+r()*20-10,a+r()*30-15,b+r()*30-15);x.stroke()}
  $('#paper').style.backgroundImage=`url(${c.toDataURL()})`})();

/* ============ characters ============ */
const LOOKS={

const AU={ctx:null,on:true,amb:null};
function audioInit(){if(AU.ctx)return;try{const A=new (window.AudioContext||window.webkitAudioContext)();AU.ctx=A;AU.m=A.createGain();AU.m.gain.value=.8;AU.m.connect(A.destination);
  const len=A.sampleRate*4,b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}AU.brown=b;
  const wb=A.createBuffer(1,A.sampleRate,A.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<wd.length;i++)wd[i]=Math.random()*2-1;AU.white=wb}catch(e){AU.ctx=null}}
function ambient(kind){const A=AU.ctx;if(!A)return;if(AU.amb){const g=AU.amb.g;g.gain.setTargetAtTime(0,A.currentTime,.6);const old=AU.amb;setTimeout(()=>{try{old.src.stop();old.lfo&&old.lfo.stop()}catch(e){}},2500)}
  const src=A.createBufferSource();src.buffer=AU.brown;src.loop=true;const f=A.createBiquadFilter();f.type='lowpass';const g=A.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.m);let lfo=null;
  if(kind==='sea'){f.frequency.value=700;const lg=A.createGain();lg.gain.value=.05;lfo=A.createOscillator();lfo.frequency.value=.11;lfo.connect(lg);lg.connect(g.gain);g.gain.setTargetAtTime(.08,A.currentTime,1.5);lfo.start()}
  else if(kind==='train'){f.frequency.value=260;g.gain.setTargetAtTime(.14,A.currentTime,.8)}
  else{f.frequency.value=320;g.gain.setTargetAtTime(.06,A.currentTime,1.5)}
  src.start();AU.amb={src,g,lfo,kind}}
const PLUCK={};
function pluck(freq,vol=.18,when=0){const A=AU.ctx;if(!A||!AU.on)return;const key=Math.round(freq);let b=PLUCK[key];if(!b){const sr=A.sampleRate,n=Math.floor(sr*2.2),N=Math.floor(sr/freq);b=A.createBuffer(1,n,sr);const d=b.getChannelData(0);for(let i=0;i<N;i++)d[i]=Math.random()*2-1;for(let i=N;i<n;i++)d[i]=(d[i-N]+d[i-N+1])*.497;PLUCK[key]=b}
  const s=A.createBufferSource();s.buffer=b;const g=A.createGain();g.gain.value=vol;const f=A.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;s.connect(f);f.connect(g);g.connect(AU.m);s.start(A.currentTime+when)}
function sfx(t){const A=AU.ctx;if(!A||!AU.on)return;const now=A.currentTime;
  if(t==='coin'){pluck(1318,.14);pluck(1760,.12,.08);return}
  if(t==='ding'){pluck(1046,.12);pluck(1568,.08,.12);return}
  if(t==='click'){pluck(660,.06);return}
  const s=A.createBufferSource();s.buffer=AU.white;const f=A.createBiquadFilter();const g=A.createGain();s.connect(f);f.connect(g);g.connect(AU.m);
  if(t==='shutter'){f.type='highpass';f.frequency.value=2000;g.gain.setValueAtTime(.3,now);g.gain.exponentialRampToValueAtTime(.001,now+.09);s.start(now,0,.1);setTimeout(()=>sfx('shut2'),90)}
  else if(t==='shut2'){f.type='bandpass';f.frequency.value=1200;g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.06);s.start(now,.3,.07)}
  else if(t==='scrub'){f.type='bandpass';f.frequency.value=3000+Math.random()*1500;f.Q.value=2;g.gain.setValueAtTime(.05,now);g.gain.exponentialRampToValueAtTime(.001,now+.08);s.start(now,Math.random()*.5,.09)}
  else if(t==='splash'){f.type='lowpass';f.frequency.setValueAtTime(3000,now);f.frequency.exponentialRampToValueAtTime(300,now+.3);g.gain.setValueAtTime(.25,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);s.start(now,0,.4)}
  else if(t==='clack'){f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.35,now);g.gain.exponentialRampToValueAtTime(.001,now+.12);s.start(now,0,.13)}}

/* ============ scene control & loop ============ */
async function enterScene(id,intro){G.scene=SCENES[id]();G.pl={x:ST.x,y:ST.y,face:1,ph:0,moving:false};G.cam=clamp(ST.x-W*.4,0,G.scene.w-W);G.dispTime=ST.time;ST.scene=id;save();
  ambient(id==='qingyu'?'sea':'town');$('#hud').hidden=false;hud();$('#help').style.opacity=1;setTimeout(()=>$('#help').style.opacity=0,9000);G.mode='play';
  await fade(false);
  if(intro&&id==='town'){await card('序章 · 第 '+ST.day.toLocaleString()+' 天','晚上 8:47 · 鑫达物流',2600);pushMsg('王总','小陈，明早九点前把华东区的报表发我。辛苦了，年轻人多锻炼。',['收到','（已读不回）']);await say(['又加班到这个点。','又是这条路。路灯、便利店、公交站，闭着眼都能走回去。'])}
  if(intro&&id==='qingyu'){await card('第一章 · 青屿','上午 9:40',2600);await say(['海的味道。比想象中咸。','兜里还剩 ¥'+ST.coins+'。先找个地方住下，再想办法赚点路费。','手机的相机，好像终于有东西可以拍了。']);toast('提示','在相机标记处按 E 拍照')}}
function nearest(){const sc=G.scene,pl=G.pl;let best=null,bd=80;for(const a of sc.acts){const d=Math.abs(a.x-pl.x);if(d<bd){bd=d;best=a}}return best}
async function interact(){if(G.busy||G.dialog||G.modal)return;const a=G.near;if(!a)return;G.busy=true;try{if(a.photo)await photo(a);else await a.act()}finally{G.busy=false;save()}}
let last=performance.now();
function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;G.t+=dt;G.boil=Math.abs(Math.floor(G.t*4.5))%2;
  if(G.mode==='play'&&G.scene){const pl=G.pl,k=G.keys;const free=!G.dialog&&!G.modal&&!G.busy&&$('#phone').style.display!=='block';let vx=0,vy=0;if(free){if(k.a||k.arrowleft)vx-=1;if(k.d||k.arrowright)vx+=1;if(k.w||k.arrowup)vy-=1;if(k.s||k.arrowdown)vy+=1}
    pl.moving=!!(vx||vy);if(vx)pl.face=vx;const sp=170;pl.x=clamp(pl.x+vx*sp*dt,40,G.scene.w-40);pl.y=clamp(pl.y+vy*90*dt,GROUND+18,GROUND+BAND);if(pl.moving)pl.ph+=dt*9;ST.x=pl.x;ST.y=pl.y;
    const target=clamp(pl.x-W*.42,0,G.scene.w-W);G.cam=lerp(G.cam,target,1-Math.pow(.02,dt));
    for(const n of G.scene.npcs){if(Math.abs(n.x-pl.x)<160)n.face=pl.x>n.x?1:-1}
    G.dispTime=lerp(G.dispTime,ST.time,1-Math.pow(.3,dt));
    G.near=free?nearest():null;const pe=$('#prompt');if(G.near){const a=G.near;const verb={talk:'交谈',look:'查看',camera:'拍照',door:'进去',sit:'坐下'}[a.icon];pe.querySelector('span').textContent=verb+' · '+a.label;pe.style.opacity=1}else pe.style.opacity=0}
  else $('#prompt').style.opacity=0;
  if(G.mode==='train'){TR.t+=dt;if(Math.floor(TR.t*2.2)!==Math.floor((TR.t-dt)*2.2))sfx('clack')}
  if(G.scene||G.mode==='train')draw();else drawTitleBg();
  musicTick(dt);requestAnimationFrame(frame)}
let titleBg=null;function drawTitleBg(){if(!titleBg)titleBg=buildQLazy();G.scene=null;ctx.setTransform(K,0,0,K,0,0);const sc=titleBg;G.scene=sc;G.cam=1180+Math.sin(G.t*.05)*120;G.pl=G.pl||{x:-999,y:560,face:1,ph:0,moving:false};G.dispTime=3;const t=ST.time;ST.time=3;const pl=G.pl;pl.x=-999;draw();ST.time=t;G.scene=null}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(G.dialog&&DQ){if(dch.children.length){e.preventDefault();const bs=[...dch.children],fi=bs.indexOf(document.activeElement);const n=parseInt(k);if(n>=1&&n<=bs.length){DQ(n-1);return}if(k==='arrowdown'||k==='s'){bs[(fi+1)%bs.length].focus();return}if(k==='arrowup'||k==='w'){bs[(fi-1+bs.length)%bs.length].focus();return}if(k==='e'||k===' '||k==='enter'){DQ(Math.max(0,fi));return}return}if(k==='e'||k===' '||k==='enter'){DQ();return}}
  if(G.mode==='title'&&(k==='enter'||k===' ')){$('#tCont').hidden?$('#tNew').click():$('#tCont').click();return}
  G.keys[k]=true;if(G.mode!=='play')return;
  if(k==='e'||k===' ')interact();if(k==='p')openPhone();if(k==='j'||k==='tab'){e.preventDefault();if($('.book'))closeModal();else if(!G.modal)openBook()}if(k==='m')$('#bSnd').click();if(k==='escape'){if(G.modal&&$('.book'))closeModal();$('#phone').style.display='none'}});
addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{G.keys={}});
dlg.addEventListener('click',e=>{if(e.target.closest('button'))return;if(DQ&&!dch.children.length)DQ()});
